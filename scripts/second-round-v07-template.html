<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第二轮剧情改稿 · v07</title>
<style>
:root{--bg:#f2f0e9;--paper:#fffdf8;--ink:#283731;--dim:#65726c;--line:#dbdfd4;--accent:#356b61;--soft:#e7eee7;--size:22px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,input,textarea{font:inherit;color:inherit}button{border:1px solid var(--line);border-radius:7px;padding:8px 12px;background:var(--paper);cursor:pointer}button:hover{background:var(--soft);border-color:var(--accent)}button:focus-visible,a:focus-visible{outline:3px solid #709e89;outline-offset:2px}a{color:var(--accent)}header{position:sticky;top:0;z-index:2;padding:16px 26px;background:#f7f6f0f5;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;gap:18px;align-items:center;flex-wrap:wrap}h1{font-size:22px;margin:0}h2{font-size:26px;margin:0 0 12px}h3{font-size:21px;margin:0 0 8px}p{margin:8px 0}.muted,small{color:var(--dim)}.tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}.layout{display:grid;grid-template-columns:260px minmax(0,1fr)}aside{position:sticky;top:101px;height:calc(100vh - 106px);overflow:auto;padding:20px;border-right:1px solid var(--line)}main{padding:26px 34px 80px;max-width:1180px;width:100%;min-width:0}input{width:100%;padding:9px;border:1px solid var(--line);border-radius:7px;background:var(--paper);margin-bottom:14px}.nav{display:block;text-align:left;width:100%;border-color:transparent;margin-bottom:6px;background:transparent;font-size:14px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.active{background:var(--accent);color:white;border-color:var(--accent)}.intro{background:var(--soft);border-left:4px solid var(--accent);padding:18px 20px;margin-bottom:24px;border-radius:6px}.chain{line-height:1.9;font-size:17px}.node{padding:25px 28px;background:var(--paper);border:1px solid var(--line);border-radius:10px;margin:20px 0;scroll-margin-top:130px}.step{display:inline-block;color:var(--accent);font-size:12px;letter-spacing:.07em;margin-bottom:8px}.purpose{color:var(--dim);font-size:14px;margin-bottom:20px}.line{border-left:2px solid #d5dfd3;margin:15px 0;padding:9px 14px;background:#faf9f3}.speaker{font-size:13px;font-weight:600;color:var(--accent)}.speech{font:var(--size)/1.85 "Songti SC","STSong","Noto Serif CJK SC",serif;white-space:pre-wrap;margin-top:5px}.note-button{float:right;padding:2px 7px;font-size:12px}.branch{border:1px solid var(--line);border-radius:7px;padding:15px 18px;margin:12px 0}.branch button.reason{font-size:18px;line-height:1.7;text-align:left;width:100%;background:transparent;border:0;padding:0}.branch details{margin-top:8px}.reply{border-left:3px solid #9dac8c;padding-left:13px}.outcome{color:var(--dim);font-size:14px}.annotation{background:#edf1e9;border:1px solid #cdd8c7;padding:15px;border-radius:7px;margin-top:15px}.annotation label{display:block;font-size:14px;margin:8px 0}.annotation textarea{width:100%;min-height:90px;padding:10px;border:1px solid var(--line);background:white;border-radius:5px;resize:vertical}.annotation button{margin-top:10px}.editorial{font-size:14px;padding:12px 15px;background:#f3f3ea;border-radius:6px;color:#56665b;margin-top:20px}.warning{padding:14px;background:#f6eddf;border:1px solid #dac39e;border-radius:7px;margin:15px 0}.notice{color:#895a25}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);max-width:85vw;background:#273d34;color:white;padding:12px 18px;border-radius:8px;z-index:4;display:none}.note-value{white-space:pre-wrap}.empty{padding:30px;color:var(--dim)}.version{font-size:12px;word-break:break-word}.first{padding:8px 0}details>summary{cursor:pointer;color:var(--accent)}.footer{margin-top:30px;font-size:13px;color:var(--dim)}@media(max-width:850px){.layout{grid-template-columns:200px minmax(0,1fr)}header{padding:14px}.tools{margin-left:0}main{padding:20px}.node{padding:20px}aside{top:150px;height:calc(100vh - 160px)}}@media(max-width:620px){.layout{display:block}aside{position:static;height:180px;border-bottom:1px solid var(--line)}main{padding:16px}.node{padding:18px}h1{font-size:19px}.tools button{font-size:13px;padding:6px 9px}.speech{font-size:var(--size)}header{position:static}.note-button{float:none;margin-left:8px}}@media print{header,aside,.tabs,.note-button,.annotation{display:none}.layout{display:block}main{padding:0;max-width:none}.node{break-inside:auto;border:0}.branch details{display:block}body{background:white}}
</style></head><body>
<header><div><h1>第二轮剧情改稿 · v07</h1><small>八卦 → 寻人 → 授权 → 举证 → 接报</small></div><div class="tools"><button id="font">大字阅读</button><button id="export">导出审稿 JSON</button><a href="第二轮_因果链与对白_v07.md" download>下载完整稿</a></div></header>
<div class="layout"><aside><input id="search" type="search" placeholder="搜索本版对白与说明" aria-label="搜索本版剧情"><nav id="nav" aria-label="本版节点"></nav><p class="version" id="version"></p><p class="version" id="storageStatus"></p></aside><main><div class="tabs"><button data-tab="main">第二轮 · 主线</button><button data-tab="eaves">帐后偷听 · 彩蛋</button><button data-tab="rules">判定与前台衔接</button><button data-tab="first">第一轮 · 现状</button><button data-tab="notes">我的审稿意见</button></div><div id="view"></div></main></div><div id="toast" role="status"></div>
<script id="story-data" type="application/json">__STORY_DATA__</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('story-data').textContent), STORAGE='sirui-story-review-v1';
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tab='main',big=false,timer,loadError='';
const targets=new Map();
for(const [section,ns] of Object.entries(DATA.sections))for(const n of ns){
  for(const l of n.lines)targets.set(`wuzhang/line/${l.id}`,{section,node:n.id,title:n.title+' · '+l.speaker,text:l.text});
  for(const c of n.choices)targets.set(`wuzhang/choice/${c.id}`,{section,node:n.id,title:n.title+' · 选项',text:c.text+'\n回应：'+c.reply+'\n结果：'+c.result});
}
let store={schema:'story-review/v1',entries:{},conflicts:[]};
function readStore(){const raw=localStorage.getItem(STORAGE);if(!raw)return {schema:'story-review/v1',entries:{},conflicts:[]};const p=JSON.parse(raw);if(p.schema!=='story-review/v1'||!p.entries||typeof p.entries!=='object'||Array.isArray(p.entries)||p.conflicts!==undefined&&!Array.isArray(p.conflicts))throw Error('审稿记录格式不兼容');return {...p,conflicts:p.conflicts||[]};}
try{store=readStore();}catch(e){loadError='本地意见未能读取：'+e.message+'。本页停止保存，现有记录保留。';}
function toast(text){$('#toast').textContent=text;$('#toast').style.display='block';clearTimeout(timer);timer=setTimeout(()=>$('#toast').style.display='none',3500);}
function noteButton(key){const e=store.entries[key]||{};return `<button class="note-button" data-note="${esc(key)}">${e.note||e.rewrite?'查看／编辑意见':'备注／改写'}</button>`;}
function card(n,i){return `<article class="node" id="${esc(n.id)}"><span class="step">${tab==='main'?'主线':tab==='eaves'?'彩蛋':'节点'} ${String(i+1).padStart(2,'0')}</span><h3>${esc(n.title)}</h3><p class="purpose">${esc(n.purpose)}</p>${n.lines.map(l=>`<div class="line" data-entry="wuzhang/line/${esc(l.id)}"><span class="speaker">${esc(l.speaker)}</span>${noteButton('wuzhang/line/'+l.id)}<p class="speech">${esc(l.text)}</p></div>`).join('')}${n.choices.length?'<p class="muted">选项与结果（展开查看回应与后续）</p>':''}${n.choices.map(c=>`<div class="branch" data-entry="wuzhang/choice/${esc(c.id)}">${noteButton('wuzhang/choice/'+c.id)}<p class="speech" style="font-size:19px">${esc(c.text)}</p><details><summary>查看回应与分支结果</summary>${c.reply?`<p class="reply speech" style="font-size:19px">${esc(c.reply)}</p>`:''}<p class="outcome">${esc(c.result)}</p></details></div>`).join('')}${n.note?`<p class="editorial"><strong>审稿说明：</strong>${esc(n.note)}</p>`:''}</article>`;}
function renderNotes(){store=loadError?store:readStore();const all=Object.entries(store.entries).filter(([k,e])=>e.note||e.rewrite||e.status&&e.status!=='unread');return `<div class="intro"><h2>我的审稿意见</h2><p>与原工作台共用本地审稿记录。旧意见按原 ID 保留，本版新增句子使用 v07 ID；导出包含全部意见与冲突。</p></div>${all.length?all.map(([k,e])=>`<article class="node"><h3>${esc(e.title||k)}</h3><small>${esc(k)}</small>${targets.has(k)?`<p><button data-locate="${esc(k)}">定位本版原句</button></p>`:'<p class="muted">历史版本意见，完整保留。</p>'}${e.note?`<p class="note-value"><strong>备注：</strong>${esc(e.note)}</p>`:''}${e.rewrite?`<p class="note-value"><strong>改写：</strong>${esc(e.rewrite)}</p>`:''}${targets.has(k)&&e.original!==targets.get(k).text?'<p class="notice">备注时原句与本版不同，请对照检查。</p>':''}</article>`).join(''):'<div class="empty">目前没有审稿意见。</div>'}${store.conflicts.length?`<div class="warning">保留 ${store.conflicts.length} 项冲突，导出 JSON 可查看两个版本。</div>`:''}`;}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false');});const q=$('#search').value.trim().toLowerCase(),ns=(DATA.sections[tab]||[]).filter(n=>!q||JSON.stringify(n).toLowerCase().includes(q));$('#nav').innerHTML=ns.map((n,i)=>`<button class="nav" data-jump="${esc(n.id)}">${i+1}. ${esc(n.title)}</button>`).join('');if(tab==='notes'){$('#view').innerHTML=renderNotes();return;}const heads={main:['第二轮 · 主线连贯阅读','甲先讲责任与时机，乙建议找姜维亲兵。取得许可后，才出现中军帐前入口，再去营前交涉。'],eaves:['帐后偷听 · 彩蛋','第二次原句不变，第三至第六次有四次进展；第七次发现已经误事。每次确认后可退出办正事。'],rules:['判定与前台衔接','记录证据、调查窗口、可重选理由、关键交涉，以及当前结局和 UI 的接入边界。'],first:['第一轮 · 当前接入基线','第一轮正文由「UI设计」维护；这里只列现状和两轮边界。']};$('#view').innerHTML=`<div class="intro"><h2>${heads[tab][0]}</h2><p>${heads[tab][1]}</p><p class="muted">${esc(DATA.status)} · ${esc(DATA.generatedAt.replace('T',' ').slice(0,19))}</p>${tab==='main'?'<p class="chain">甲讲责任与时机 → 乙建议找亲兵 → 请示取得许可 → 开放中军帐前 → 营前举证 → 姜维接报下令</p>':''}</div>${loadError?`<p class="warning">${esc(loadError)}</p>`:''}${ns.map(card).join('')||'<div class="empty">没有匹配内容。</div>'}<p class="footer">本页用于审稿。正式游戏仍使用当前 chapter.json；本候选稿尚未成为可玩流程。</p>`;}
function openNote(key){const box=document.querySelector(`[data-entry="${CSS.escape(key)}"]`);if(!box)return;const previous=box.querySelector('.annotation');if(previous){previous.remove();return;}try{if(!loadError)store=readStore();}catch(e){loadError=e.message;}const e=store.entries[key]||{},editor=document.createElement('div');editor.className='annotation';editor.dataset.key=key;editor.dataset.baseline=JSON.stringify(e);editor.innerHTML=`<label>备注</label><textarea data-field="note" aria-label="备注">${esc(e.note||'')}</textarea><label>建议原文（未写则保留当前稿）</label><textarea data-field="rewrite" aria-label="建议原文">${esc(e.rewrite||'')}</textarea><button data-save="${esc(key)}" ${loadError?'disabled':''}>保存意见</button><small> 仅保存审稿意见，不改剧情正文。</small>`;box.append(editor);editor.querySelector('textarea').focus();}
function saveNote(key){if(loadError){toast(loadError);return;}const editor=document.querySelector(`.annotation[data-key="${CSS.escape(key)}"]`),target=targets.get(key);if(!editor||!target)return;try{const fresh=readStore(),existing=fresh.entries[key]||{},baseline=JSON.parse(editor.dataset.baseline),incoming={...baseline,title:target.title,original:target.text,note:editor.querySelector('[data-field="note"]').value,rewrite:editor.querySelector('[data-field="rewrite"]').value,updatedAt:new Date().toISOString(),contentVersion:DATA.version};if(JSON.stringify(existing)!==JSON.stringify(baseline)){fresh.conflicts.push({key,incoming,importedAt:new Date().toISOString()});localStorage.setItem(STORAGE,JSON.stringify(fresh));store=fresh;toast('另一页面已更新此意见；两个版本已保留，请在导出文件中核对。');return;}fresh.entries[key]=incoming;localStorage.setItem(STORAGE,JSON.stringify(fresh));store=fresh;editor.dataset.baseline=JSON.stringify(incoming);toast('意见已保存');}catch(e){toast('保存失败：'+e.message+'。输入仍保留。');}}
document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;$('#search').value='';render();window.scrollTo({top:0});}if(b.dataset.jump)document.getElementById(b.dataset.jump)?.scrollIntoView({behavior:'smooth'});if(b.dataset.note)openNote(b.dataset.note);if(b.dataset.save)saveNote(b.dataset.save);if(b.dataset.locate){const target=targets.get(b.dataset.locate);tab=target.section;$('#search').value='';render();document.getElementById(target.node)?.scrollIntoView();openNote(b.dataset.locate);}});
$('#font').addEventListener('click',()=>{big=!big;document.documentElement.style.setProperty('--size',big?'26px':'22px');$('#font').textContent=big?'恢复字号':'大字阅读';});
$('#search').addEventListener('input',render);
$('#export').addEventListener('click',()=>{try{if(!loadError)store=readStore();const p={...store,exportedAt:new Date().toISOString(),contentVersion:DATA.version,sourceVersions:[...(Array.isArray(store.sourceVersions)?store.sourceVersions:[]),{version:DATA.version,sourceSha256:DATA.sourceSha256,status:DATA.status}]};const url=URL.createObjectURL(new Blob([JSON.stringify(p,null,2)],{type:'application/json;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='剧情审稿意见_v07_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出本版与历史意见');}catch(e){toast('导出失败：'+e.message);}});
$('#version').textContent=DATA.version+' · 底稿 '+DATA.sourceSha256.slice(0,12);
$('#storageStatus').textContent=loadError||'意见沿用原工作台存储；仅手动保存时写入。';
render();
window.secondRoundReview={getData:()=>DATA,getReview:()=>JSON.parse(JSON.stringify(loadError?store:readStore()))};
</script></body></html>
