<style>

r-radius:4px;padding:2px 6px;background:#e9eae3;white-space:nowrap}.panel,.node-card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:24px;margin-bottom:20px}.intro{padding:16px 20px;background:#e7eee8;border:1px solid #d1ddd4;border-radius:9px;margin-bottom:20px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.node-heading{display:flex;align-items:flex-start;gap:15px;justify-content:space-between}.meta{color:var(--dim);font-size:14px;margin-bottom:14px}.rule{font-size:14px;background:#f2f3ed;border-left:3px solid #c3d3ca;padding:10px 13px;margin:10px 0;color:#485a5b}.line{position:relative;margin:13px 0;padding:12px 14px;border-left:2px solid #d5dfd7; background:#fbfaf6}.line .speech{font-family:"Songti SC","STSong","Noto Serif CJK SC",serif;font-size:var(--font);line-height:1.95;white-space:pre-wrap;margin:3px 0}.speaker{font-size:13px;font-weight:600;color:var(--accent)}.note-button{font-size:12px;padding:2px 7px;float:right}.reviewbox{background:#f3f4ef;border:1px solid #d8e0d6;padding:12px;border-radius:7px;margin-top:12px}.reviewbox label{display:block;font-size:13px;color:var(--dim);margin:6px 0}.reviewbox textarea{width:100%;min-height:78px;resize:vertical;display:block}.reviewbox input{width:100%}.branch{margin:16px 0;padding:16px;border:1px solid var(--line);border-radius:8px}.branch-title{color:var(--accent);font-weight:600;font-size:17px}.branch.ai{border-color:#bdd1c8}.next{padding-top:9px;border-top:1px dashed var(--line);font-size:14px}.next button{font-size:13px;padding:4px 8px}.ref-details{margin:10px 0;font-size:13px;color:var(--dim)}summary{cursor:pointer}pre{white-space:pre-wrap;word-break:break-word;background:#f1f2ec;color:#455358;padding:13px;font-size:12px;line-height:1.6;max-height:540px;overflow:auto}code{font-size:12px}.route-bar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.route-step{padding:10px 14px;margin:0 0 20px;border-left:4px solid #83a195;background:#eaf0eb}.flow-group{margin:24px 0}.flow-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:13px}.flow-card{padding:15px;background:var(--paper);border:1px solid var(--line);border-radius:8px;text-align:left}.flow-card>button{display:block;width:100%;text-align:left;font-weight:600;border:0;background:none;padding:0;font-size:16px}.flow-card small{display:block}.flow-branch{border-top:1px dotted #d5d9ce;margin-top:9px;padding-top:7px;font-size:13px}.flow-branch button{padding:2px 5px;font-size:12px}.flow-seq{display:flex;overflow-x:auto;gap:10px;padding:15px 0 20px;align-items:stretch}.seq-item{min-width:190px;max-width:230px;flex-shrink:0}.seq-item button{width:100%;height:100%;text-align:left;padding:14px}.arrow{align-self:center;color:#82978e}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:10px;vertical-align:top}.notice{color:var(--amber)}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:10;background:#263d36;color:white;padding:10px 20px;border-radius:8px;display:none;max-width:85vw}.danger-note{padding:14px;border:1px solid #d3bea2;background:#f7f0e2;border-radius:7px}.note-item{padding:18px;background:var(--paper);border:1px solid var(--line);border-radius:8px;margin:12px 0}.empty{padding:30px;color:var(--dim);text-align:center}.print-title{display:none}.inventory{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:15px 0}.inventory>div{padding:15px;background:#f5f5ee;border:1px solid var(--line);border-radius:7px}.inventory strong{display:block;font-size:22px}.filter-row{display:flex;gap:5px}.filter-row select{flex:1;min-width:0;width:50%;font-size:13px;padding:7px 4px}#chapterSelect{max-width:100%}.count{font-size:12px}.note-value{white-space:pre-wrap}.error{color:#a44338}.result-link{font-size:13px;color:var(--accent)}@media(max-width:1050px){.layout{grid-template-columns:255px minmax(0,1fr)}main{padding:20px}header{padding:12px}.tools{margin-left:0}aside{top:150px;height:calc(100vh - 160px)}.inventory{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.layout{display:block}aside{position:static;height:300px}.panel,.node-card{padding:17px}.tools{gap:4px}main{padding:15px}}@media print{header,aside,.tabs,.tools,.note-button{display:none}main{padding:0}.layout{display:block}.node-card{break-inside:auto}.print-title{display:block}body{background:white}.panel{border:0}.reviewbox{break-inside:avoid}}

.round-switch{display:flex;align-items:stretch;gap:12px;flex-wrap:wrap;margin-bottom:14px}.round-switch button{flex:1;min-width:180px;text-align:left;padding:14px 18px;font-weight:600}.round-switch button small{display:block;font-weight:400;color:inherit;opacity:.85}.round-switch button.round-all{flex:0 1 auto;min-width:100px;font-size:13px}.round-summary{margin-bottom:18px;padding:14px 18px;border-left:4px solid var(--accent);background:var(--soft);border-radius:5px}.round-summary strong{font-size:20px;display:block}.round-summary p{font-size:14px}.round-switch button.active{box-shadow:0 2px 6px #356b6120}@media print{.round-switch{display:none}}
</style></head><body>
<header><div><h1>剧情审稿工作台</h1><small id="version"></small></div><div class="tools"><span id="saved" aria-live="polite"></span><button id="font">大字阅读</button><button id="exportJson">导出审稿 JSON</button><button id="exportMd">导出 Markdown</button><button id="import">导入审稿文件</button><input id="importFile" type="file" accept=".json,.md,.markdown" hidden></div></header>
<div class="layout"><aside><label for="chapterSelect">运行章节</label><select id="chapterSelect"></select><input class="search" id="search" type="search" placeholder="搜索全部对白、选项、规则…" aria-label="搜索剧情"><div class="filter-row"><select id="groupFilter" aria-label="节点分组"><option value="all">全部分组</option></select><select id="statusFilter" aria-label="审阅状态"><option value="all">全部状态</option><option value="unread">尚未标记</option><option value="read">已读</option><option value="discuss">待讨论</option><option value="noted">有备注</option></select></div><p class="count" id="navCount"></p><nav id="nav" aria-label="全量节点目录"></nav></aside><main><div class="round-switch" role="navigation" aria-label="按剧情轮次阅读"><button data-round="first">第一轮 · 默认剧情<small>固定教学顺序</small></button><button data-round="second">第二轮 · 复活后<small>调查、姜维路线与分支</small></button><button class="round-all" data-round="all">全部节点<small>对照查阅</small></button></div><div id="roundSummary" class="round-summary"></div><div class="tabs" role="navigation"><button data-tab="flow">路线与流程</button><button data-tab="node">节点全文</button><button data-tab="read">按路线连贯阅读</button><button data-tab="reference">场景与规则</button><button data-tab="ai">AI 回应定义</button><button data-tab="external">结局视频与地图</button><button data-tab="notes">我的审稿意见</button><button data-tab="coverage">内容版本与核查</button><button data-tab="confirmed">最新输入与已确认设定</button></div><div id="view"></div></main></div><div id="toast" role="status"></div>
<script id="story-data" type="application/json">__STORY_DATA__</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('story-data').textContent);
const STORAGE='sirui-story-review-v1';
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let store={schema:'story-review/v1',entries:{},conflicts:[]},loadError='';
try{const raw=localStorage.getItem(STORAGE);if(raw){const parsed=JSON.parse(raw);if(parsed.schema!=='story-review/v1'||!parsed.entries||typeof parsed.entries!=='object')throw Error('保存格式不兼容');store={...store,...parsed};}}catch(e){loadError='本地审稿记录未能读取：'+e.message+'。现有浏览器存档不会被本页覆盖，请先导出或检查浏览器存储。';}
let chapter=DATA.chapters[0],tab='flow',selected=chapter.dialogues[0].id,route='tutorial',round='first';
let expanded=new Set(),toastTimer;
const disabledNode=n=>JSON.stringify(n.availableWhen)==='{"not":{"all":[]}}';
const groupNames={tutorial:'教学 · 举证、判定与重试',opening:'第二轮调查起点',investigation:'调查与证据',shared:'第二轮 · 魏延交涉',illness:'病势调查',failure:'失败与放弃',ending:'结局',repeat:'本轮重读',archived:'保留的旧流程 · 当前关闭'};
const groupOf=n=>disabledNode(n)?'archived':n.id.startsWith('tutorial.')||['player.intro','player.revival'].includes(n.id)?'tutorial':n.id==='player.investigation'?'opening':n.id.includes('.reread')?'repeat':n.id.startsWith('ending.')?'ending':n.id.startsWith('player.delay_')?'illness':n.id==='weiyan.execution'?'failure':['weiyan.negotiate','weiyan.notice'].includes(n.id)?'shared':'investigation';
const routes={
 tutorial:{name:'第一轮 · 固定教学流程与判定结果',hint:'先找魏延，三次硬拦教学后取证；逐项出示禁令与军情，说明合理阻拦与即时传报办法，不要求姜维。成功后被抬走，进入牺牲结局；点击“重试本关”→“重来本关”，进入第二轮。普通办法不合理会入帐灯灭，严重挑衅会当场处斩。各结果分开列出。',ids:['player.intro','tutorial.weiyan','tutorial.notice','player.notice_plan','tutorial.scout','scout.notice','scout.followup','tutorial.weiyan.notice','tutorial.weiyan.negotiate','tutorial.execution','tutorial.failure','weiyan.execution','player.revival']},
 authorized:{name:'第二轮 · 调查姜维路线 → 帐外接报 → 生还',hint:'重新收集本轮证据。禁令先确认，再逐项出示营门未失守与姜维接报路线，自己提出谁现在去请姜维接报。魏延接受即进入成功结局，无第三次交涉或逐步交接。',ids:['player.revival','player.investigation','notice.read','player.notice_plan','guard.duty','guard.ask_urgent','guard.ask_inside','guard.ask_relay','scout.report','scout.notice','scout.followup','scout.scope','guard.connect_evidence','weiyan.purpose','weiyan.notice','weiyan.negotiate','ending.safe']},
 investigation:{name:'调查与证据 · 全部话题',hint:'调查话题集中阅读，排列不代表强制顺序。',ids:[]},
 illness:{name:'病势调查',hint:'以节点出现条件与实际效果为准。',ids:['curtain.listen','player.delay_0','player.delay_1','weiyan.delay_warning','ending.lamp_failure']},
 failure:{name:'第二轮 · 入帐灯灭或严重挑衅处斩',hint:'普通不合理办法让魏延强行入帐；严重挑衅才当场处斩。结局页可重试或返回首页，失败返回首页进入地图。',ids:['weiyan.purpose','weiyan.notice','weiyan.negotiate','weiyan.execution','ending.lamp_failure','ending.execution']},
 repeat:{name:'本轮已读话题',hint:'重读仅对应本轮，不提供上一轮信息。',ids:[]},
 archived:{name:'保留的旧流程 · 当前关闭',hint:'原始章节保留这些节点，出现条件恒为假。它们不是 v06 可游玩的第三次交涉、获准传报或越职递报路线。旧 ID 留存用于定位历史备注。',ids:[]},
 all:{name:'全量运行源 · 含当前关闭节点',hint:'保留原始章节全部节点、对白与条件；当前关闭节点另行标明。',ids:[]}
};
const roundNames={first:'第一轮 · 默认剧情',second:'第二轮 · 复活后',all:'全部节点 · 两轮对照'};
function firstRoundIds(){return new Set([...(routes.tutorial?.ids||[]),...chapter.dialogues.filter(n=>n.id.startsWith('tutorial.')||n.id==='player.intro').map(n=>n.id)]);}
function inRound(n){return !!n&&(round==='all'||(round==='first'?firstRoundIds().has(n.id):!n.id.startsWith('tutorial.')&&n.id!=='player.intro'));}
function roundNodes(){return chapter.dialogues.filter(inRound);}
function roundGroup(n){return round==='second'&&n.id==='player.revival'?'opening':groupOf(n);}
function showRound(id){round=id;route=id==='first'?'tutorial':id==='second'?(routes.authorized?'authorized':'investigation'):'all';$('#groupFilter').value='all';if(!inRound(node(selected)))selected=routeIds()[0]||roundNodes()[0]?.id;}
function followNode(id){if(!inRound(node(id)))showRound(firstRoundIds().has(id)?'first':'second');selected=id;}
function renderRound(){document.querySelectorAll('[data-round]').forEach(b=>{const active=b.dataset.round===round;b.classList.toggle('active',active);b.setAttribute('aria-current',active?'page':'false');});const explanation=round==='first'?(DATA.revision?'第一轮是写死的教学剧情：看告示、问斥候 → 用军令硬拦魏延 → 被处斩 → 复活。此轮不展开姜维路线，按下方顺序审阅即可。':'第一轮的教学顺序与后续牺牲剧情固定；交涉仍按玩家提出的合理阻拦与即时传报办法判定，不要求姜维。牺牲结局后选择重试，再进入第二轮。'):round==='second'?'从复活后的正常调查起点开始，重新收集证据，发现姜维接报路线，再与魏延交涉。当前关闭的旧交接节点单独保留，不算可玩路线。':'两轮节点完整保留，便于搜索、定位旧意见和检查遗漏。复活节点在两轮中均可查阅。';$('#roundSummary').innerHTML=`<strong>${esc(roundNames[round])}</strong><p>${esc(explanation)}</p>`;}
function restartInfo(){const r=chapter.restart;return r?`<p>读完 ${buttonNode(r.afterNodeId)} 后进入牺牲结局页。“重试本关”→“重来本关”进入第二轮，正常调查起点为 ${buttonNode(r.restartNodeId)}；${buttonNode(r.revivalNodeId)} 是保留的复活对白定义。当前前台不会读完就自动复活。</p><p>重来本关只保留教学完成与玩家级结局／地图记录；证据、许可、人物状态、对白记录、草稿及本轮交涉上下文清空。下列为引擎底层配置，前台结局衔接见“结局视频与地图”。</p>${rawDetails(r,'底层复活与重开配置')}`:'<p>本章节未配置独立重开节点。</p>';}
function names(collection,id){return chapter[collection]?.find(x=>x.id===id)?.[collection==='characters'?'name':'title']||id;}
const node=id=>chapter.dialogues.find(n=>n.id===id);
const key=(kind,id)=>`${chapter.id}/${kind}/${id}`;
const entry=(kind,id)=>store.entries[key(kind,id)]||{};
const statusLabel=s=>({unread:'尚未标记',read:'已读',discuss:'待讨论'}[s]||'尚未标记');
function humanValue(v){return typeof v==='boolean'?(v?'是':'否'):({approaching:'正赶往传报处',waiting:'在候报处等待',departed:'已经离开',relay_tent:'侧帐传令处',waiting_area:'帐外候报处',none:'尚无 / 尚未完成',direct:'越职递报方案',authorized:'获准传报方案',delivered:'军情已递入',replied:'已收取回话',relayed:'回话已转达',lamp_failure:'灯灭',execution:'处斩',safe:'保灯且生还',tutorial_execution:'教学中被抬走后处置'}[v]??String(v));}
function condition(c){if(!c)return '无附加条件';if(c.all)return c.all.length?c.all.map(x=>'（'+condition(x)+'）').join(' 且 '):'无附加条件';if(c.any)return c.any.length?c.any.map(x=>'（'+condition(x)+'）').join(' 或 '):'没有可满足的条件';if(c.not)return '不满足「'+condition(c.not)+'」';if(c.flag)return (chapter.initialFlags.find(f=>f.id===c.flag)?.description||c.flag)+'：'+humanValue(c.equals);if(c.evidence)return(c.mode==='held'?'本轮持有':'本次当面出示')+'「'+names('evidence',c.evidence)+'」';if(c.intent)return '表达意图为「'+intentName(c.intent)+'」';return JSON.stringify(c);}
function intentName(id){for(const n of chapter.dialogues)for(const i of n.freeInput?.intentOptions||[])if(i.id===id)return i.label;return({propose_wait:'提出暂候',propose_handoff:'提出转递',ask_contact:'请人递话',revise_plan:'修订方案'}[id]||id);}
function effects(xs){return (xs||[]).map(x=>x.type==='setFlag'?(chapter.initialFlags.find(f=>f.id===x.flag)?.description||x.flag)+' → '+humanValue(x.value):x.type==='grantEvidence'?'取得本轮证据「'+names('evidence',x.evidenceId)+'」':({startPromise:'开始等待承诺',fulfillPromise:'完成等待承诺',breakPromise:'打破等待承诺'}[x.type]||x.type)+'「'+(chapter.promises.find(p=>p.id===x.promiseId)?.description||x.promiseId)+'」').join('；')||'无状态变化';}
function rawDetails(obj,title='内部定位与源字段'){return `<details class="ref-details"><summary>${esc(title)}</summary><pre>${esc(JSON.stringify(obj,null,2))}</pre></details>`;}
function buttonNode(id,label){return id&&node(id)?`<button data-node="${esc(id)}">${esc(label||node(id).title)}</button>`:esc(label||id||'返回当前场景，自由调查 / 继续行动');}
function noteBox(kind,id,origin=''){const k=key(kind,id),e=store.entries[k]||{};return `<div class="reviewbox" data-review="${esc(k)}"><label>你的备注</label><textarea data-field="note" aria-label="备注 ${esc(id)}" placeholder="记录疑问、保留意见或需要确认的内容">${esc(e.note||'')}</textarea><label>你的改写建议（留空亦可）</label><textarea data-field="rewrite" aria-label="改写建议 ${esc(id)}" placeholder="输入你希望采用的文字；本页不会写回正式剧本">${esc(e.rewrite||'')}</textarea><small>稳定定位：${esc(k)}${origin?' · '+esc(origin):''}</small></div>`;}
function noteToggle(kind,id){const e=entry(kind,id),open=expanded.has(key(kind,id));return `<button class="note-button" data-note-kind="${kind}" data-note-id="${esc(id)}">${e.note||e.rewrite?'✎ 已有意见':'✎ 备注 / 改写'}${open?' · 收起':''}</button>`;}
function lines(xs){return xs.length?xs.map(l=>`<div class="line" data-line-id="${esc(l.id)}"><div class="speaker">${esc(names('characters',l.speakerId))}${noteToggle('line',l.id)}</div><div class="speech">${esc(l.text)}</div>${l.when?`<div class="rule">本句显示条件：${esc(condition(l.when))}</div>`:''}${l.effects?.length?`<div class="rule">确认这句话后：${esc(effects(l.effects))}</div>`:''}${l.mediaId?`<small>演出资源：${esc(l.mediaId)}</small>`:''}${expanded.has(key('line',l.id))?noteBox('line',l.id,l.text):''}${rawDetails({id:l.id,...(l.when?{when:l.when}:{}),effects:l.effects},'本句内部定位')}</div>`).join(''):'<p class="muted">此段没有固定前置对白。</p>';}
function nextHTML(id){return `<div class="next">后续去向：${buttonNode(id)}${id?'':'。自动事件仍会按当前事实检查，见下方关联。'}</div>`;}
function outcome(o){return lines(o.reply)+`<div class="rule">整段回应确认后：${esc(effects(o.effects))}</div>`+nextHTML(o.next);}
const statusNames={accept:'认可（条件未匹配时的兜底回应）',need_evidence:'还需证据',need_plan:'还需接报安排',out_of_scope:'请求超出范围',clarify:'需要澄清'};
function flagsOf(c,arr=[]){if(c?.flag)arr.push({id:c.flag,value:c.equals});for(const x of c?.all||c?.any||[])flagsOf(x,arr);if(c?.not)flagsOf(c.not,arr);return arr;}
function nodeEffects(n){return [...n.onComplete,...n.lines.flatMap(l=>l.effects),...n.choices.flatMap(c=>[...c.outcome.effects,...c.outcome.reply.flatMap(l=>l.effects),...(chapter.actions.find(a=>a.id===c.actionId)?.effects||[])]),...Object.values(n.freeInput?.outcomes||{}).flatMap(o=>[...o.effects,...o.reply.flatMap(l=>l.effects)]),...(n.freeInput?chapter.judges.find(j=>j.id===n.freeInput.judgeId)?.acceptanceCases.flatMap(c=>[...c.outcome.effects,...c.outcome.reply.flatMap(l=>l.effects)])||[]:[])];}
function stateRelations(n){const fx=nodeEffects(n).filter(x=>x.type==='setFlag');return chapter.dialogues.filter(d=>d.id!==n.id&&flagsOf(d.availableWhen).some(f=>fx.some(x=>f.id===x.flag&&f.value===x.value)));}
function renderNode(n){const s=entry('node',n.id);const cases=n.freeInput?chapter.judges.find(j=>j.id===n.freeInput.judgeId):null;return `<article class="node-card" data-node-id="${esc(n.id)}"><div class="node-heading"><div><div class="meta">${esc(groupNames[roundGroup(n)])} · ${esc(names('scenes',n.sceneId))} · ${esc(names('characters',n.characterId))}</div><h2>${esc(n.title)}</h2></div><select data-node-status="${esc(n.id)}" aria-label="节点审阅状态 ${esc(n.id)}"><option value="unread" ${!s.status||s.status==='unread'?'selected':''}>尚未标记</option><option value="read" ${s.status==='read'?'selected':''}>已读</option><option value="discuss" ${s.status==='discuss'?'selected':''}>待讨论</option></select></div>${disabledNode(n)?'<p class="danger-note">此节点当前关闭：出现条件恒为假。保留原文与旧备注供追溯，不属于当前可玩流程。</p>':''}<div class="rule">出现条件：${esc(condition(n.availableWhen))}<br>触发方式：${esc({topic:'主动选择人物话题',present_evidence:'向此人出示证据',event:'由剧情事件进入'}[n.trigger])} · ${esc({once_ever:'整个经历只播放一次',once_per_loop:'每轮播放一次',repeatable:'可再次打开'}[n.repeat])} · 同话题存在多个版本时，优先采用符合条件且优先级最高的版本。</div>${n.targetStatement?`<p>待回应的说法：${esc(n.targetStatement)}</p>`:''}${noteToggle('node',n.id)}${expanded.has(key('node',n.id))?noteBox('node',n.id,n.title):''}<h3>完整对白</h3>${lines(n.lines)}${n.choices.length?'<h3>全部选项与回应</h3>':''}${n.choices.map((c,i)=>{const a=chapter.actions.find(a=>a.id===c.actionId);return `<section class="branch" data-choice-id="${esc(c.id)}"><div class="branch-title">${i+1}. ${esc(c.label)}${noteToggle('choice',c.id)}</div>${expanded.has(key('choice',c.id))?noteBox('choice',c.id,c.label):''}<div class="rule">可见：${esc(condition(c.visibleWhen))}<br>可选：${esc(condition(c.enabledWhen))}${c.lockedText?'<br>不可选时的提示：'+esc(c.lockedText):''}</div>${a?`<div class="rule">选择时实际执行：${esc(a.title)}<br>行动条件：${esc(condition(a.availableWhen))}<br>等待消耗：${a.timeCost==='delay'?'消耗一次等待（第一次警告，达到承诺阈值后破约）':'不消耗等待'}<br>行动后：${esc(effects(a.effects))}${a.next?'<br>行动指定去向：'+buttonNode(a.next):''}</div>`:'<small>此选项没有独立行动；结果由下列回应和效果定义。</small>'}${outcome(c.outcome)}${rawDetails(c,'选项内部定位与完整定义')}</section>`;}).join('')}${n.freeInput?`<section class="branch ai"><h3>自由输入与举证</h3><p>输入提示：${esc(n.freeInput.placeholder)}</p><p>可编辑起句：${esc(n.freeInput.starterText)}</p><p>引导问题：${n.freeInput.guidingQuestions.map(esc).join('；')}</p><p>可选意图：${n.freeInput.intentOptions.map(x=>esc(x.label)).join(' / ')} · ${n.freeInput.evidenceSelection==='required'?'必须选择证据':'可选择证据'} · 最长 ${n.freeInput.maxLength} 字</p>${cases?`<div class="rule">接受的意图：${cases.acceptedIntentIds.map(x=>esc(intentName(x))).join(' / ')}<br>论证要点：${cases.requiredPoints.map(esc).join('；')}<br>禁止主张：${cases.forbiddenClaims.map(esc).join('；')}</div>`:''}<p class="muted">以下是全部固定回应定义。语义认可后按当前事实取首个匹配的认可分支；魏延未匹配时回到澄清。魏延回应以当前结果第一句作为固定结论，再拼接动态开头，详见「AI 回应定义」。</p>${Object.entries(n.freeInput.outcomes).map(([st,o])=>`<section class="branch" data-outcome-status="${st}"><h4>${esc(st==='out_of_scope'&&['weiyan.negotiate','tutorial.weiyan.negotiate'].includes(n.id)?'严重挑衅 → 当场处斩':statusNames[st]||st)}</h4>${outcome(o)}${rawDetails({status:st,definition:o})}</section>`).join('')}${cases?.acceptanceCases.map((c,i)=>`<section class="branch" data-acceptance-case="${i}"><h4>认可分支 ${i+1} · ${c.outcome.effects.some(e=>e.flag==='loop.route'&&e.value==='authorized')?'获准传报':c.outcome.effects.some(e=>e.flag==='loop.route'&&e.value==='direct')?'越职递报':'按下列条件匹配'}</h4><div class="rule">适用条件：${esc(condition(c.when))}</div>${outcome(c.outcome)}${rawDetails(c,'认可分支内部定位')}</section>`).join('')||''}${rawDetails(n.freeInput,'自由输入完整定义')}</section>`:''}<div class="rule">线性节点完成后：${esc(effects(n.onComplete))}。选项或自由输入段使用各自的回应效果。</div>${n.id===chapter.restart?.afterNodeId?'<p class="rule">当前前台：牺牲结局页 → 重试本关 → 重来本关 → 第二轮正常调查。</p>':nextHTML(n.next)}${renderRelated(n)}${rawDetails(n,'整个节点的原始定义')}</article>`;}
function renderRelated(n){const ev=chapter.events.filter(e=>flagsOf(e.when).some(f=>nodeEffects(n).some(x=>x.type==='setFlag'&&x.flag===f.id&&x.value===f.value)));const peers=chapter.dialogues.filter(d=>d.id!==n.id&&d.topicId===n.topicId&&d.characterId===n.characterId&&d.sceneId===n.sceneId);const rel=stateRelations(n);return `<details class="ref-details"><summary>流程关联 · 自动事件 / 同话题版本 / 状态条件</summary>${ev.map(e=>`<p>可能关联自动事件：${buttonNode(e.next)}<br>必须完整满足：${esc(condition(e.when))}<br>事件发生时：${esc(effects(e.effects))}</p>`).join('')||'<p>未发现共享写入条件的自动事件。</p>'}${peers.length?'<p>同一话题的其他版本：'+peers.map(d=>buttonNode(d.id)).join(' ' )+'</p>':''}${rel.length?'<p>共享状态条件的其他节点（供查阅，不代表直接跳转）：'+rel.map(d=>buttonNode(d.id)).join(' ')+'</p>':''}</details>`;}
function routeIds(){let ids;if(route==='all')ids=roundNodes().map(n=>n.id);else if(route==='repeat'||route==='investigation'||route==='archived')ids=roundNodes().filter(n=>roundGroup(n)===route).map(n=>n.id);else ids=(routes[route]?.ids||[]).filter(id=>inRound(node(id)));if(round==='second'&&route==='authorized'&&node('player.revival'))ids=['player.revival',...ids.filter(id=>id!=='player.revival')];return ids;}
function routeButtons(){if(round==='first')return '';return `<div class="route-bar">${Object.entries(routes).filter(([id])=>round==='all'||id!=='tutorial').map(([id,r])=>`<button data-route="${id}" class="${route===id?'active':''}">${esc(id==='all'&&round==='second'?'第二轮 · 全部节点':r.name)}</button>`).join('')}</div>`;}
function successors(n){const paths=[];if(n.id===chapter.restart?.afterNodeId)paths.push(['牺牲结局页 → 重试本关 → 重来本关（前台）',chapter.restart.restartNodeId]);else if(n.next)paths.push(['对白完成',n.next]);for(const c of n.choices){const a=chapter.actions.find(a=>a.id===c.actionId);paths.push([c.label,a?.next||c.outcome.next]);}if(n.freeInput){for(const [st,o]of Object.entries(n.freeInput.outcomes))paths.push([st==='out_of_scope'&&['weiyan.negotiate','tutorial.weiyan.negotiate'].includes(n.id)?'严重挑衅 → 当场处斩':statusNames[st],o.next]);for(const [i,c]of chapter.judges.find(j=>j.id===n.freeInput.judgeId).acceptanceCases.entries())paths.push(['认可分支 '+(i+1),c.outcome.next]);}return paths;}
function renderFlow(){const ids=routeIds();return `<div class="intro"><strong>${esc(roundNames[round])}：左侧仅显示本轮 ${roundNodes().length} 个节点。</strong><p>${round==='first'?'本轮按固定教学顺序展示，点击节点阅读完整正文。复活后切换第二轮，查看调查、姜维路线与分支。':'点击节点读完整正文。下方分支显示运行稿中明确的后续；没有后续 ID 时回到场景交互。自由调查之间的顺序由玩家选择，状态与自动事件在节点内另列。所有分支均可查阅，无需先走通关线。'}</p></div>${routeButtons()}<h2>${esc(routes[route].name)}</h2><p class="muted">${esc(routes[route].hint)}</p><div class="flow-seq" aria-label="路线阅读顺序">${ids.map((id,i)=>`${i?'<span class="arrow">→</span>':''}<div class="seq-item"><button data-node="${esc(id)}"><small>阅读 ${i+1}</small><br>${esc(node(id).title)}</button></div>`).join('')}</div><p class="muted">上方箭头为阅读顺序；下方每张卡中的箭头为运行稿明确跳转。当前关闭的旧路线另列；各结果为备选分支，不表示一次游玩全部发生。</p>${Object.entries(groupNames).map(([g,label])=>{const ns=roundNodes().filter(n=>roundGroup(n)===g);if(!ns.length)return '';return `<section class="flow-group"><h3>${esc(label)} <small>${ns.length} 节点</small></h3><div class="flow-grid">${ns.map(n=>`<div class="flow-card" data-flow-node="${esc(n.id)}"><button data-node="${esc(n.id)}">${esc(n.title)}</button><small>${esc(names('scenes',n.sceneId))} · ${esc(names('characters',n.characterId))} · ${statusLabel(entry('node',n.id).status)}</small>${successors(n).map(([label,next])=>`<div class="flow-branch">${esc(label)} → ${next?buttonNode(next):'<span class="muted">返回场景交互</span>'}</div>`).join('')||'<div class="flow-branch muted">读完 → 返回场景交互</div>'}</div>`).join('')}</div></section>`;}).join('')}<section class="panel"><h3>自动事件的独立入口</h3>${chapter.events.filter(e=>inRound(node(e.next))).map(e=>`<div class="branch">${buttonNode(e.next)}<div class="rule">触发条件：${esc(condition(e.when))}<br>发生效果：${esc(effects(e.effects))}</div>${rawDetails(e)}</div>`).join('')}</section>${round!=='second'?`<section class="panel"><h3>教学复活与重新开始</h3>${restartInfo()}<button data-tab="reference">查看完整状态表</button></section>`:''}`;}
function genericRecord(kind,obj,title,body){return `<section class="branch"><h3>${esc(title)}${noteToggle(kind,obj.id)}</h3>${expanded.has(key(kind,obj.id))?noteBox(kind,obj.id,title):''}${body}${rawDetails(obj)}</section>`;}
function renderReference(){return `<section class="panel"><h2>场景、人物与规则全文</h2><p>这里保留运行稿的所有附属定义；节点正文在左侧目录。</p><h3>场景 · ${chapter.scenes.length}</h3>${chapter.scenes.map(x=>genericRecord('scene',x,x.title,`<p>可见：${esc(condition(x.visibleWhen))}</p><p>进入：${esc(condition(x.enterWhen))}</p><p>不能进入时：${esc(x.lockedText)}</p><p>场景资源：${esc(x.mediaId||'无')}</p>`)).join('')}<h3>人物 · ${chapter.characters.length}</h3>${chapter.characters.map(x=>genericRecord('character',x,x.name,`<p>动机：${esc(x.motivation)}</p><p>所在位置：${x.placements.map(p=>esc(names('scenes',p.sceneId))+'（'+esc(condition(p.when))+'）').join('；')}</p><p>人物可见：${esc(condition(x.visibleWhen))}</p><p>交谈条件：${esc(condition(x.talkWhen))}</p><p>无法交谈时：${esc(x.unavailableText)}</p><p>闲置提示：${esc(x.idleText)}</p>`)).join('')}<h3>证据 · ${chapter.evidence.length}</h3>${chapter.evidence.map(x=>genericRecord('evidence',x,x.title,`<p>来源：${esc(x.source)}</p><p>可证明：${x.proves.map(esc).join('；')}</p><p>不能证明：${x.cannotProve.map(esc).join('；')}</p><p>史料属性：${esc({history:'史实',romance:'演义',fiction:'架空补写'}[x.historicalBasis]||x.historicalBasis)}</p>`)).join('')}<h3>全部行动 · ${chapter.actions.length}</h3>${chapter.actions.map(x=>genericRecord('action',x,x.title,`<p>执行条件：${esc(condition(x.availableWhen))}</p><p>等待消耗：${x.timeCost==='delay'?'消耗一次':'不消耗'}</p><p>执行后：${esc(effects(x.effects))}</p>${nextHTML(x.next)}`)).join('')}<h3>等待承诺 · ${chapter.promises.length}</h3>${chapter.promises.map(x=>genericRecord('promise',x,x.description,`<p>必做动作：${x.requiredActionIds.map(id=>esc(names('actions',id))).join(' → ')}</p><p>完成条件：${esc(condition(x.completedWhen))}</p><p>允许耗时阈值：${x.delayBudget} 次。首次警告，达到阈值破约。</p><p>破约后：${esc(effects(x.brokenEffects))}</p>`)).join('')}<h3>自动事件 · ${chapter.events.length}</h3>${chapter.events.map(x=>genericRecord('event',x,names('dialogues',x.next),`<p>触发：${esc(condition(x.when))}</p><p>效果：${esc(effects(x.effects))}</p>${nextHTML(x.next)}<p>优先级：${x.priority}</p>`)).join('')}<h3>复活与重开状态 · ${chapter.initialFlags.length}</h3>${restartInfo()}<table><thead><tr><th>状态含义</th><th>归属</th><th>重开行为 / 初值</th><th>允许值</th></tr></thead><tbody>${chapter.initialFlags.map(f=>`<tr><td>${esc(f.description)}<details><summary>定位</summary><code>${esc(f.id)}</code></details></td><td>${esc(names('characters',f.owner))}</td><td>${chapter.restart?.preserveFlagIds.includes(f.id)?'仅保留流程进度':'每轮重置'} · ${esc(humanValue(f.initial))}</td><td>${f.allowedValues?.map(v=>esc(humanValue(v))).join(' / ')||'源文件未列枚举'}</td></tr>`).join('')}</tbody></table></section>`;}
function renderAI(){const p=DATA.aiPack;return `<section class="panel"><h2>AI 回应与固定认可全文</h2><div class="intro">动态回应由玩家文字及当前事实生成，无法枚举为全部固定对白。本页完整列出固定锚点、固定认可、自由输入全部返回类型和实际生成定义；本页不会调用 AI。</div><h3>魏延的全部固定反馈锚点 · ${Object.keys(p.anchors).length}</h3><p>以下结论直接来自两轮交涉的结果定义，重复 ID 合并展示，已经计入章节固定台词。AI 仅补充受约束的开头，结果和效果由程序确定。</p>${Object.entries(p.anchors).map(([id,text])=>`<div class="line" data-anchor-id="${esc(id)}"><span class="speaker">魏延 · ${esc({authority_unproven:'声称奉命但未证明',claim_unproven:'关键说法未证明',need_evidence_notice:'缺禁入告示',need_evidence_scout:'缺军情依据',need_evidence_approval:'缺今夜准信',need_plan:'缺接报安排',need_plan_reply:'缺回话安排',out_of_scope:'超出权限',clarify:'澄清方案'}[id]||id)}</span>${noteToggle('ai-anchor',id)}<div class="speech">${esc(text)}</div>${expanded.has(key('ai-anchor',id))?noteBox('ai-anchor',id,text):''}${rawDetails({id,text},'锚点定位')}</div>`).join('')}<h3>固定认可与全部返回分支</h3>${chapter.dialogues.filter(n=>n.freeInput).map(n=>`<div class="branch"><h4>${buttonNode(n.id)}</h4><p>所有固定返回类型与认可分支均在节点全文。下方重复列出真正匹配的认可段，方便集中审核。</p>${chapter.judges.find(j=>j.id===n.freeInput.judgeId).acceptanceCases.map((c,i)=>`<div class="branch"><h4>认可分支 ${i+1}</h4><p>${esc(condition(c.when))}</p>${outcome(c.outcome)}</div>`).join('')}</div>`).join('')}<h3>动态生成的范围与回退</h3><p>魏延：程序先决定回应类型与状态效果。AI 只生成 0–35 字的开头，拼在不可改变的固定锚点前。固定结论始终取已选结果的第一句，上列展示本章节全部魏延固定结论。模型输出超出约束时舍弃开头；措辞生成超时或异常时只显示固定锚点。${p.mode==='current-utterance'?'判定与措辞只读取本次玩家文字及本次出示证据；不使用之前对白或魏延记忆。两轮均有等待、强行入帐、严重挑衅处斩三种决定；证据与即时传报规则见下方实际指令。':'未证实的奉命问题持续到明确纠正或实际出示本轮有效准信。'}</p><p>乙：AI 仅判定语义，回应使用运行稿固定文本。语义解释与缺项记录供内部复核，不作为无限新增固定对白。真正判定服务异常时显示独立技术提示，保留输入，不推进剧情。</p><h3>魏延人物定义</h3>${Object.entries(p.persona).map(([k,v])=>`<p><strong>${esc({name:'姓名',role:'身份',goal:'目标',temperament:'性格',voice:'口吻',boundaries:'知情与行为边界'}[k]||k)}：</strong>${esc(Array.isArray(v)?v.join('；'):v)}</p>`).join('')}<h3>实际语义分类指令（全文）</h3>${p.classifier_instructions.map((s,i)=>`<p class="note-value">${i+1}. ${esc(s)}</p>`).join('')}<h3>实际回应生成指令（全文）</h3>${p.renderer_instructions.map((s,i)=>`<p class="note-value">${i+1}. ${esc(s)}</p>`).join('')}${noteToggle('definition','weiyan-generation')}${expanded.has(key('definition','weiyan-generation'))?noteBox('definition','weiyan-generation','魏延动态生成定义'):''}${rawDetails({reasonCodes:p.reasonCodes},'全部内部原因码')}<h3>运行界面补充固定文字</h3><p>非对白节点的证据回应、服务异常、军情进度与结局 / 回溯界面，保留源表达式以覆盖每个条件分支。</p>${[...DATA.uiFixed,...DATA.playerHints].map(x=>`<div class="line" data-ui-id="${esc(x.id)}"><div class="speaker">${esc(x.title)} · ${esc(x.kind)}${noteToggle('ui-definition',x.id)}</div><div class="speech">${esc(x.text)}</div>${expanded.has(key('ui-definition',x.id))?noteBox('ui-definition',x.id,x.text):''}</div>`).join('')}<p>条件界面的完整表达式（含各结果分支）：</p>${DATA.uiExcerpts.map((x,i)=>`<details class="branch"><summary>${esc(x.label)}</summary><pre>${esc(x.text)}</pre></details>`).join('')}<h3>实际运行代码附录（定位用）</h3>${DATA.runtime.map(x=>`<details><summary>${esc(x.path)}</summary><pre>${esc(x.text)}</pre></details>`).join('')}</section>`;}
function validKeys(){const s=new Set();for(const p of DATA.chapters){const add=(kind,id)=>s.add(`${p.id}/${kind}/${id}`);for(const n of p.dialogues){add('node',n.id);for(const c of n.choices)add('choice',c.id);}const walk=v=>{if(Array.isArray(v))v.forEach(walk);else if(v&&typeof v==='object'){if(v.speakerId&&v.id)add('line',v.id);Object.values(v).forEach(walk);}};walk(p);for(const [coll,kind]of [['scenes','scene'],['characters','character'],['evidence','evidence'],['actions','action'],['promises','promise'],['events','event']])p[coll].forEach(x=>add(kind,x.id));Object.keys(DATA.aiPack.anchors).forEach(id=>add('ai-anchor',id));add('definition','weiyan-generation');[...DATA.uiFixed,...DATA.playerHints,...(DATA.external?.lines||[])].forEach(x=>add('ui-definition',x.id));}return s;}
const knownKeys=validKeys();
function findTarget(k){if(!knownKeys.has(k))return null;const [cid,kind,...rest]=k.split('/'),id=rest.join('/'),p=DATA.chapters.find(x=>x.id===cid);if(!p)return null;if(kind==='node')return {chapter:cid,node:id};for(const n of p.dialogues){if(kind==='choice'&&n.choices.some(c=>c.id===id))return {chapter:cid,node:n.id};if(kind==='line'&&JSON.stringify(n).includes('"id":"'+id+'"'))return {chapter:cid,node:n.id};if(kind==='line'&&n.freeInput&&JSON.stringify(p.judges.find(j=>j.id===n.freeInput.judgeId)).includes('"id":"'+id+'"'))return {chapter:cid,node:n.id};}return {chapter:cid,tab:kind==='ui-definition'&&DATA.external?.lines.some(x=>x.id===id)?'external':kind.startsWith('ai')||kind==='definition'||kind==='ui-definition'?'ai':'reference'};}
function renderNotes(){const items=Object.entries(store.entries).filter(([k,e])=>e.note||e.rewrite||e.status&&e.status!=='unread');return `<section class="panel"><h2>我的审稿意见</h2><p>按稳定 ID 保存，导入会合并；同一项意见不同会保留两个版本供你处理。内容版本改变后，旧意见仍在；源句不同会标记“内容已变更”，无法定位的意见也会保留。</p>${items.length?items.map(([k,e])=>{const target=findTarget(k),current=currentText(k);return `<div class="note-item"><div class="row"><strong>${esc(e.title||k)}</strong><span class="badge">${statusLabel(e.status)}</span>${target?.node?`<button data-target="${esc(k)}">定位节点</button>`:target?`<button data-target="${esc(k)}">定位定义</button>`:''}</div><small>${esc(k)} · ${esc(e.updatedAt||'')}</small>${!knownKeys.has(k)?'<p class="notice">当前运行稿已无此 ID；旧意见完整保留。</p>':e.original&&current!==e.original?'<p class="notice">内容已变更，请结合当前运行稿确认意见。</p>':''}${e.note?'<p class="note-value"><strong>备注：</strong>'+esc(e.note)+'</p>':''}${e.rewrite?'<p class="note-value"><strong>改写：</strong>'+esc(e.rewrite)+'</p>':''}${e.original?'<details><summary>备注时的原文</summary><p>'+esc(e.original)+'</p></details>':''}<details><summary>编辑此项意见</summary>${noteBoxByKey(k)}</details></div>`;}).join(''):'<div class="empty">还没有审稿意见。到任一句、选项或节点点「备注 / 改写」，或为节点标记已读、待讨论。</div>'}${store.conflicts.length?`<h3>导入冲突 · 两个版本均已保留</h3>${store.conflicts.map((c,i)=>`<div class="note-item"><strong>${esc(c.key)}</strong><p>当前版本</p><pre>${esc(JSON.stringify(store.entries[c.key],null,2))}</pre><p>导入版本</p><pre>${esc(JSON.stringify(c.incoming,null,2))}</pre><button data-conflict="${i}" data-resolution="keep">保留当前版</button> <button data-conflict="${i}" data-resolution="incoming">采用导入版</button></div>`).join('')}`:''}</section>`;}
function noteBoxByKey(k){const parts=k.split('/');const e=store.entries[k]||{};return `<div class="reviewbox" data-review="${esc(k)}"><label>备注</label><textarea data-field="note">${esc(e.note||'')}</textarea><label>改写建议</label><textarea data-field="rewrite">${esc(e.rewrite||'')}</textarea></div>`;}
function currentText(k){const [cid,kind,...r]=k.split('/'),id=r.join('/'),p=DATA.chapters.find(c=>c.id===cid);if(!p)return '';if(kind==='line'){let result='';const walk=v=>{if(Array.isArray(v))v.forEach(walk);else if(v&&typeof v==='object'){if(v.id===id&&v.speakerId)result=v.text;Object.values(v).forEach(walk);}};walk(p);return result;}if(kind==='node')return p.dialogues.find(n=>n.id===id)?.title||'';if(kind==='choice')return p.dialogues.flatMap(n=>n.choices).find(c=>c.id===id)?.label||'';if(kind==='ai-anchor')return DATA.aiPack.anchors[id]||'';if(kind==='ui-definition')return [...DATA.uiFixed,...DATA.playerHints,...(DATA.external?.lines||[])].find(x=>x.id===id)?.text||'';if(kind==='definition')return '魏延动态生成定义';const coll={scene:'scenes',character:'characters',evidence:'evidence',action:'actions',promise:'promises',event:'events'}[kind];return coll?p[coll].find(o=>o.id===id)?.title||p[coll].find(o=>o.id===id)?.name||p[coll].find(o=>o.id===id)?.description||id:id;}

function filteredNodes(){const q=$('#search').value.trim().toLowerCase(),g=$('#groupFilter').value,s=$('#statusFilter').value;return chapter.dialogues.filter(n=>{const e=entry('node',n.id),notes=Object.keys(store.entries).some(k=>findTarget(k)?.node===n.id&&(store.entries[k].note||store.entries[k].rewrite));return inRound(n)&&(g==='all'||roundGroup(n)===g)&&(s==='all'||s==='noted'&&notes||s==='unread'&&(!e.status||e.status==='unread')||e.status===s)&&(!q||JSON.stringify(n).toLowerCase().includes(q)||names('characters',n.characterId).toLowerCase().includes(q)||condition(n.availableWhen).toLowerCase().includes(q)||n.freeInput&&JSON.stringify(chapter.judges.find(j=>j.id===n.freeInput.judgeId)).toLowerCase().includes(q));});}

anch"><summary>${esc(x.role)} · ${esc(x.path)}</summary><pre>${esc(x.text)}</pre><small>SHA-256：${esc(x.sha256)}</small></details>`).join('')}<details class="branch"><summary>前台结局展示与地图衔接代码快照</summary><pre>${esc(e.renderExcerpt)}</pre></details><p class="muted">本页接收源码定义与其他对话的进展，不表示本聊天已验证实际视频、地图视觉或全部游戏路线。用户新点评仍保留，并与现行源对照。</p></section>`;}

function decodeBase64(s){const bin=atob(s);return new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0)));}
function markdown(){const p=exportPayload();return `# 剧情审稿意见\n\n运行稿版本：${DATA.version}\n导出时间：${p.exportedAt}\n\n`+Object.entries(p.entries).map(([k,e])=>`## ${e.title||k}\n\n- 稳定 ID：\`${k}\`\n- 状态：${statusLabel(e.status)}\n- 备注时内容版本：${e.contentVersion||''}\n\n${e.original?'原文：\n\n> '+e.original.replace(/\n/g,'\n> ')+'\n\n':''}${e.note?'备注：\n\n'+e.note+'\n\n':''}${e.rewrite?'改写建议：\n\n'+e.rewrite+'\n\n':''}`).join('')+(p.conflicts.length?'## 未处理导入冲突\n\n```json\n'+JSON.stringify(p.conflicts,null,2)+'\n```\n\n':'')+'---\n\n以下数据块支持原样回导；正文用于阅读，请在工作台编辑意见后重新导出。\n\n<!-- story-review-json-base64\n'+utf8Base64(JSON.stringify(p))+'\n-->\n';}
function importText(text){let p;if(text.trim().startsWith('{'))p=JSON.parse(text);else{const m=text.match(/<!-- story-review-json-base64\s+([A-Za-z0-9+/=\s]+)\s+-->/);if(!m)throw Error('Markdown 缺少可回导数据块，请导入原工作台导出的文件。');p=JSON.parse(decodeBase64(m[1].replace(/\s/g,'')));}if(p.schema!=='story-review/v1'||!p.entries||typeof p.entries!=='object'||Array.isArray(p.entries))throw Error('不是兼容的审稿文件');const incoming=Object.entries(p.entries);for(const [k,e]of incoming){if(!k.includes('/')||!e||typeof e!=='object'||Array.isArray(e))throw Error('存在无效意见记录');for(const field of ['note','rewrite','original','title','status'])if(e[field]!==undefined&&typeof e[field]!=='string')throw Error('意见字段格式不合法');if(e.status&&!['unread','read','discuss'].includes(e.status))throw Error('审阅状态不合法');}if(p.conflicts!==undefined&&!Array.isArray(p.conflicts))throw Error('冲突记录格式不合法');for(const c of p.conflicts||[])if(!c||typeof c.key!=='string'||!c.incoming||typeof c.incoming!=='object')throw Error('冲突记录格式不合法');let added=0,conflicts=0;for(const [k,e]of incoming){const old=store.entries[k];if(!old){store.entries[k]=e;added++;}else if((old.note||'')!==(e.note||'')||(old.rewrite||'')!==(e.rewrite||'')||(old.status||'unread')!==(e.status||'unread')){const c={key:k,incoming:e,importedAt:new Date().toISOString()};if(!store.conflicts.some(x=>x.key===k&&JSON.stringify(x.incoming)===JSON.stringify(e)))store.conflicts.push(c);conflicts++;}}for(const c of p.conflicts||[])if(!store.conflicts.some(x=>x.key===c.key&&JSON.stringify(x.incoming)===JSON.stringify(c.incoming)))store.conflicts.push(c);persist();render();toast(`导入完成：新增 ${added} 项；${conflicts} 项意见不同，两个版本已保留。`);return {added,conflicts};}
document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;if(b.dataset.round){showRound(b.dataset.round);tab='flow';render();window.scrollTo(0,0);}else if(b.dataset.tab){tab=b.dataset.tab;render();window.scrollTo(0,0);}else if(b.dataset.node){followNode(b.dataset.node);tab='node';render();window.scrollTo(0,0);}else if(b.dataset.route){route=b.dataset.route;render();}else if(b.dataset.noteId){const k=key(b.dataset.noteKind,b.dataset.noteId);expanded.has(k)?expanded.delete(k):expanded.add(k);const scroll=window.scrollY;render();window.scrollTo(0,scroll);const box=[...document.querySelectorAll('[data-review]')].find(el=>el.dataset.review===k);box?.querySelector('textarea')?.focus({preventScroll:true});}else if(b.dataset.target){const t=findTarget(b.dataset.target);if(t){chapter=DATA.chapters.find(c=>c.id===t.chapter);$('#chapterSelect').value=chapter.id;if(t.node)followNode(t.node);tab=t.node?'node':t.tab;expanded.add(b.dataset.target);render();const item=[...document.querySelectorAll('[data-review]')].find(el=>el.dataset.review===b.dataset.target);if(item)item.scrollIntoView({block:'center'});else window.scrollTo(0,0);}}else if(b.dataset.conflict!==undefined){const i=Number(b.dataset.conflict),c=store.conflicts[i];if(b.dataset.resolution==='incoming')store.entries[c.key]=c.incoming;store.conflicts.splice(i,1);persist();render();}});
document.addEventListener('input',ev=>{const el=ev.target;if(el.dataset.field){updateEntry(el.closest('[data-review]').dataset.review,el.dataset.field,el.value);}});
document.addEventListener('change',ev=>{const el=ev.target;if(el.dataset.nodeStatus){updateEntry(key('node',el.dataset.nodeStatus),'status',el.value);renderNav();}});
$('#search').addEventListener('input',renderNav);$('#groupFilter').addEventListener('change',renderNav);$('#statusFilter').addEventListener('change',renderNav);
$('#chapterSelect').innerHTML=DATA.chapters.map(c=>`<option value="${esc(c.id)}">${esc(c.title)}</option>`).join('');$('#chapterSelect').addEventListener('change',()=>{chapter=DATA.chapters.find(c=>c.id===$('#chapterSelect').value);selected=chapter.dialogues[0].id;showRound('first');render();});
$('#groupFilter').insertAdjacentHTML('beforeend',Object.entries(groupNames).map(([k,v])=>`<option value="${k}">${esc(v)}</option>`).join(''));
$('#font').addEventListener('click',()=>{const big=getComputedStyle(document.documentElement).getPropertyValue('--font').trim()==='18px';document.documentElement.style.setProperty('--font',big?'21px':'18px');$('#font').textContent=big?'标准字号':'大字阅读';});
$('#exportJson').addEventListener('click',()=>download('剧情审稿意见_'+new Date().toISOString().slice(0,10)+'.json','application/json;charset=utf-8',JSON.stringify(exportPayload(),null,2)));
$('#exportMd').addEventListener('click',()=>download('剧情审稿意见_'+new Date().toISOString().slice(0,10)+'.md','text/markdown;charset=utf-8',markdown()));
$('#import').addEventListener('click',()=>$('#importFile').click());$('#importFile').addEventListener('change',async ev=>{const f=ev.target.files[0];if(!f)return;try{importText(await f.text());}catch(e){toast('导入失败：'+e.message);}ev.target.value='';});
$('#version').textContent=`${chapter.title} · ${DATA.version} · ${DATA.generatedAt.slice(0,16).replace('T',' ')}`;$('#saved').textContent=loadError?'本地存档需检查':'意见保存在当前浏览器';
render();
// Read-only inspection hooks for repeatable acceptance; all UI edits still use normal controls.
window.storyReview={getData:()=>DATA,getReview:()=>JSON.parse(JSON.stringify(store)),getStableKeys:()=>[...knownKeys]};
</script></body></html>
