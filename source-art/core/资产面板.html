<!doctype html><meta charset="utf-8"><title>逆转五丈原 · 核心资产</title><style>body{background:#141716;color:#eee;font:16px system-ui;margin:32px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px}figure{margin:0;background:#222725;padding:16px}img{width:100%;height:260px;object-fit:contain}p{line-height:1.6;color:#bdc5c0}h1{font-weight:500}</style><h1>核心人物与场景</h1><p>六名人物各一个身份入口；场景与道具单列。18项，待review。</p><main><figure><img src="甲.png"><h2>甲</h2><p>只锁甲的中年宽脸、黑布包髻、短须与旧铁札甲，不复制背景及画风</p></figure><figure><img src="乙.png"><h2>乙</h2><p>只锁乙的年轻长脸、软巾、深灰交领布衣，不复制背景及画风</p></figure><figure><img src="斥候.png"><h2>斥候</h2><p>只锁年轻斥候脸、束发、窄头带与褐色札甲</p></figure><figure><img src="姜维.png"><h2>姜维</h2><p>单人身份图：只锁青年姜维的脸、高束发、蓝灰领与札甲；不复制表情、背景或站姿</p></figure><figure><img src="魏延.png"><h2>魏延</h2><p>单人身份图：只锁魏延中年宽脸、黑巾、短浓须、暗朱衣与细片札甲；不复制怒眉、背景或站姿</p></figure><figure><img src="诸葛亮.png"><h2>诸葛亮</h2><p>从现片5.9秒提取，锁诸葛亮消瘦长脸、披发、灰黑长须、黑袍白襟</p></figure><figure><img src="中军帐.png"><h2>中军帐</h2><p>只锁中军大帐、闭帘、门侧火盆、右侧告示、土路及木栏的空间；时段按分镜</p></figure><figure><img src="将军帐.png"><h2>将军帐</h2><p>姜维自己的小帐、右侧灯架与木栏；不能当中军帐，不默认姜维在这里</p></figure><figure><img src="传报处.png"><h2>传报处</h2><p>传报棚、桌案及通道；与中军帐和将军帐分开</p></figure><figure><img src="玩家衣袖.png"><h2>玩家衣袖</h2><p>只锁我之灰褐平纹麻布袖、右手与单根细木矛；不锁构图，不要求持续持矛入镜</p></figure><figure><img src="夜营.png"><h2>夜营</h2><p>夜营大空间、外圈停马点、营道与远处主帐；不复制图中人脸</p></figure><figure><img src="灯阵.png"><h2>灯阵</h2><p>落地主灯、周围灯阵和侧通道；图中人脸不作为身份</p></figure><figure><img src="铜灯.png"><h2>铜灯</h2><p>只锁三足双环铜灯器型、地面比例和灭后细烟；不强制首帧</p></figure><figure><img src="帐门.png"><h2>帐门</h2><p>主帐门框、厚帘、守卒与随从空间；人物身份由单独人物图控制</p></figure><figure><img src="工位.png"><h2>工位</h2><p>同一现代夜间工位、代码显示器、台灯、水杯和鼠标</p></figure><figure><img src="手机.png"><h2>手机</h2><p>横屏黑框手机、同一成年男子双手和深灰袖口；屏内只放熄灯画面</p></figure><figure><img src="同学.png"><h2>同学</h2><p>同学演示AI的真实聚会空间；演示者不是玩家本人</p></figure><figure><img src="离职.png"><h2>离职</h2><p>第一视角抱纸箱离开工位的现代空间与双手；不拍玩家脸</p></figure></main>
