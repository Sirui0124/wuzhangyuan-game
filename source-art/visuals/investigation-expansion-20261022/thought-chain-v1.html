<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>粮路倒查 · 思绪画布</title>
<style>
:root{color-scheme:dark;font-family:KaiTi,STKaiti,'楷体',serif;color:#e1d4ac;background:#101f24;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 55% 35%,#28413d80,transparent 65%),linear-gradient(#102125e8,#0c181ef5),url('../chapter-expansion-20261022/scenes/granary-night-v1.png') center/cover fixed}main{max-width:1280px;margin:auto;padding:35px 55px}header,footer{display:flex;justify-content:space-between;align-items:center;color:#b4b49d;font-size:20px}header{border-bottom:1px solid #b4a87930;padding-bottom:20px}h1{font-weight:400;font-size:32px;letter-spacing:5px;text-align:center;margin:50px 0 12px}.intro{text-align:center;font-size:20px;color:#a9b7a6;margin:0}button{font:inherit;cursor:pointer;color:inherit;border:0;background:none}button:focus-visible{outline:2px solid #d8ba79;outline-offset:7px}.chain{display:flex;align-items:center;margin:65px 0 25px;gap:12px}.node{position:relative;flex:1;font-size:28px;letter-spacing:2px;padding:24px 0 30px;white-space:nowrap;color:#82938d}.node:after{content:'';position:absolute;bottom:8px;left:35%;right:35%;height:1px;background:#83958b55;transform:rotate(-2deg)}.node.active{color:#f1d597;text-shadow:0 0 25px #d7b87966}.node.active:after{background:#d9b475;box-shadow:0 2px 3px #d9b47566}.arrow{width:48px;height:1px;flex-shrink:0;background:linear-gradient(90deg,#8d9b8644,#c8b681)}.arrow:after{content:'';display:block;width:7px;height:7px;border-top:1px solid #c8b681;border-right:1px solid #c8b681;transform:translate(40px,-3px) rotate(45deg)}.reverse{text-align:center;color:#a8b9aa;font-size:20px;letter-spacing:3px;margin-bottom:38px}.record{max-width:820px;margin:auto;border-top:1px solid #a49a7144;padding:22px 0;min-height:250px}h2{font-size:28px;font-weight:400;margin:0 0 18px}.record p{font-size:20px;line-height:1.9;color:#c8cbbb;margin:10px 0}.choices{display:flex;gap:28px;flex-wrap:wrap;margin-top:24px}.choices button{font-size:20px;padding:12px 20px;border:1px solid #b79d6055;background:#b89a4f0b}.choices button:hover,.choices button[aria-pressed=true]{border-color:#d7b777;color:#f1d597;background:#b89a4f20}.record .note{color:#b5a679;min-height:32px}footer{border-top:1px solid #b4a87930;margin-top:30px;padding-top:20px}#next{background:linear-gradient(110deg,#c7aa6e,#e0c48e);color:#263332;padding:12px 27px;font-size:20px}#next:disabled{opacity:.35;cursor:default}.caption{font-size:14px;text-align:center;color:#7e938d;margin:28px 0 0}button:disabled{cursor:default}.node:disabled{opacity:.6}@media(max-width:850px){main{padding:24px 18px}.chain{gap:5px;margin-top:40px}.node{writing-mode:vertical-rl;font-size:26px;white-space:normal;display:flex;align-items:center;height:160px}.arrow{width:22px}.arrow:after{transform:translate(14px,-3px) rotate(45deg)}.node:after{left:25%;right:25%}h1{font-size:28px}header,footer{font-size:16px}.choices{gap:12px}.choices button{flex:1;min-width:200px}.record{min-height:320px}}
</style>
<main><header><span>逆转五丈原</span><span>思 绪 · 粮 路</span></header><h1>粮，究竟少在何处？</h1><p class="intro">同村，同批。从本队领取处，沿粮路往回查。</p><nav class="chain" aria-label="粮运环节"></nav><div class="reverse">← 从右往左，逐环核对</div><section class="record" aria-live="polite"></section><footer><button id="reset">重看这条粮路</button><button id="next">再往前查 ←</button></footer><p class="caption">第二章交互样稿 · 楷体链路 · 尚未接入正式剧情</p></main>
<script>
const labels=['地方应征','实际征收','入仓','调拨发出','粮队领取'];
const steps=[
{title:'领取与发出',record:'出仓交付与本队签收相合；沿途登记的损耗，解释不了领粮时就已有的缺口。',choices:['缺口在领取前，继续查','莫非是苟安途中丢粮？']},
{title:'发出与入仓',record:'本批实际入仓的粮，已有发往本队的记录。没有另存的一批足额现粮。',choices:['再查入仓之前','莫非仍有粮被扣住？']},
{title:'入仓与实收',record:'地方实收与仓中入账相合；这一批实际收到的粮，并未足额。',choices:['往征收端查','莫非已经收足，却未入仓？']},
{title:'实收与应征',record:'应征，写的是要求交多少；实收，才是已经收到多少。两者并不相等。',choices:['这批粮从未备齐','应征额便是备好的现粮？']}
];
let step=0,furthest=0,answers=[null,null,null,null];
function render(){document.querySelector('.chain').innerHTML=labels.map((label,i)=>`${i?'<span class="arrow" aria-hidden="true"></span>':''}<button class="node ${i===4-step||i===3-step?'active':''}" data-node="${i}" ${Math.max(0,3-i)>furthest?'disabled':''} aria-label="${label}，查看相关账目">${label}</button>`).join('');const s=steps[step];document.querySelector('.record').innerHTML=`<h2>${s.title}</h2><p>${s.record}</p><div class="choices">${s.choices.map((c,i)=>`<button data-choice="${i}" aria-pressed="${answers[step]===i}">${c}</button>`).join('')}</div><p class="note">${answers[step]===null?'这些记录，说明了什么？':answers[step]===1?'暂记此疑，尚待核实。也可改换判断。':'已记下这一步的判断，可随时回看。'}</p>`;document.querySelector('#next').disabled=answers[step]===null;document.querySelector('#next').textContent=step===3?'回看已有判断':'再往前查 ←';}
document.addEventListener('click',e=>{const choice=e.target.closest('[data-choice]'),node=e.target.closest('[data-node]');if(choice){answers[step]=Number(choice.dataset.choice);render()}else if(node&&!node.disabled){step=Math.min(furthest,Math.max(0,3-Number(node.dataset.node)));render()}});
document.querySelector('#next').onclick=()=>{if(answers[step]===null)return;if(step<3){step++;furthest=Math.max(furthest,step)}else{step=0}render()};document.querySelector('#reset').onclick=()=>{step=0;furthest=0;answers=[null,null,null,null];render()};render();
</script></html>
