<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>夷陵 · 御营附近的集结营</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edece6;color:#25312a;font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid #dcbd7b;outline-offset:4px}button:disabled{cursor:wait}button{transition:background .18s,color .18s}
.shell{max-width:1920px;margin:auto}.topbar{height:54px;padding:0 26px;display:flex;align-items:center;justify-content:space-between;gap:20px;background:#f7f6f1;border-bottom:1px solid #d8d9d0}.brand{font-family:"Noto Serif CJK SC","SimSun",serif;font-size:19px;letter-spacing:3px}.edition{font-size:12px;letter-spacing:0;color:#788074;margin-left:16px}.top-tools{display:flex;gap:7px}.top-tools button{border:1px solid #c9cec4;border-radius:3px;background:transparent;color:#3c4b3e;padding:5px 13px;font-size:13px}.top-tools button[aria-pressed=true]{color:#fff;background:#3f5141;border-color:#3f5141}
.stage{position:relative;aspect-ratio:16/9;background:#19211b;overflow:hidden}.canvas{position:relative;width:100%;height:100%}.stage:fullscreen{aspect-ratio:auto;width:100vw;height:100vh}.stage:fullscreen .canvas{position:absolute;inset:0;margin:auto;width:min(100vw,177.777778vh);height:min(56.25vw,100vh)}.scene{display:block;width:100%;height:100%;object-fit:contain}.stage.loading .scene{opacity:.35}.stage.loading .marks,.stage.loading .routes{visibility:hidden}.scene{transition:opacity .25s}.vignette{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#07100c66,transparent 18%,transparent 70%,#0a110bd4)}
.scene-header{position:absolute;left:3.2%;top:3.7%;color:#f5f3e7;text-shadow:0 2px 4px #0008;pointer-events:none}.scene-header .place{font-family:"Noto Serif CJK SC","SimSun",serif;font-size:clamp(18px,2.15vw,33px);letter-spacing:4px;line-height:1.4}.scene-header .identity{font-size:clamp(10px,.9vw,14px);opacity:.82;letter-spacing:2px}.direction{position:absolute;right:3.2%;top:4%;font-size:clamp(10px,.9vw,14px);color:#e2e4d8;text-shadow:0 1px 3px #000;letter-spacing:2px}.version{margin-top:7px;font-size:11px;border-left:2px solid #b6b89a;padding-left:8px;color:#daddce}
.marks,.routes{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.pin{position:absolute;transform:translate(-50%,-100%);border:0;background:#102017d9;color:#f3efdc;padding:6px 13px;border-radius:2px;font-size:clamp(11px,1vw,15px);white-space:nowrap;box-shadow:0 2px 8px #0002;pointer-events:auto}.pin:after{content:"";position:absolute;left:calc(50% - 2px);bottom:-7px;width:5px;height:5px;background:#e6dbb2;transform:rotate(45deg)}.pin:hover,.pin.active{background:#d5c79c;color:#1d2b1e}.pin.minor{font-size:clamp(10px,.86vw,13px);padding:3px 8px;background:#17271cba}
.views{position:absolute;bottom:2.8%;left:50%;transform:translateX(-50%);display:flex;gap:10px;max-width:95%;align-items:flex-end}.view{border:1px solid #d5d5b852;background:#0e1a13c9;color:#d9dfd2;padding:0;min-width:99px;width:clamp(85px,8.2vw,132px);overflow:hidden;border-radius:2px;box-shadow:0 2px 12px #0002}.view img{width:100%;aspect-ratio:16/7;object-fit:cover;display:block;opacity:.55;filter:saturate(.8)}.view span{display:block;padding:6px 5px;font-size:clamp(10px,.9vw,13px);letter-spacing:1px}.view:hover img{opacity:.9}.view[aria-pressed=true]{border-color:#decda2;background:#cdbd92;color:#19271d}.view[aria-pressed=true] img{opacity:1;filter:none}.error{position:absolute;inset:35% 15%;color:white;text-align:center;font-size:18px}.hidden{display:none!important}
.below{padding:18px 26px 22px;display:grid;grid-template-columns:minmax(220px,1fr) auto;gap:14px 28px}.context{margin:0;color:#4e5c4d;max-width:800px}.route-picker{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.route-picker button{border:1px solid #c5cbbb;background:transparent;border-radius:2px;color:#465440;padding:5px 14px}.route-picker button[aria-pressed=true]{background:#40513e;color:#fff;border-color:#40513e}.route-picker .label{font-size:12px;color:#77816d;margin-right:5px}.details{padding:0 26px 22px;color:#6f7867;font-size:13px}.details summary{cursor:pointer;width:max-content}.details p{max-width:1000px}a{color:#416246}.hint{font-size:12px;color:#7b8275;margin-top:7px}
.views{position:relative;bottom:auto;left:auto;transform:none;width:100%;max-width:none;justify-content:center;background:#18231b;padding:12px 20px}.vignette{background:linear-gradient(180deg,#07100c55,transparent 18%,transparent 83%,#0a110b22)}
@media(max-width:800px){.topbar{height:48px;padding:0 12px}.brand{font-size:16px}.edition{display:none}.top-tools{gap:5px}.top-tools button{padding:4px 7px;font-size:11px}.views{gap:5px;width:100%;padding:10px 8px}.view{width:16%;min-width:0}.view img{display:none}.view span{font-size:10px;padding:5px 2px;letter-spacing:0}.scene-header .place{font-size:19px}.identity,.direction,.version{font-size:9px!important;letter-spacing:0!important}.below{display:block;padding:14px 12px}.context{font-size:13px}.route-picker{justify-content:flex-start;margin-top:12px;gap:5px}.route-picker button{font-size:12px;padding:4px 10px}.details{padding:0 12px 18px}.pin{padding:3px 7px}.pin.minor{padding:2px 5px}.hint{font-size:11px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main class="shell">
<header class="topbar"><div class="brand">逆转五丈原 <span class="edition">夷陵 · 已确认场景</span></div><div class="top-tools"><button id="compare" aria-pressed="false">对照旧版</button><button id="labels-toggle" aria-pressed="true">隐藏标记</button><button id="fullscreen">全屏</button></div></header>
<section class="stage loading" id="frame" aria-label="夷陵营地场景"><div class="canvas">
<img id="scene" class="scene" alt=""><div class="vignette"></div><svg class="routes" viewBox="0 0 1920 1080" aria-hidden="true"></svg><div class="marks"></div>
<div class="scene-header"><div class="place"></div><div class="identity">刘备御营附近的集结营</div><div class="version">场景精修版</div></div><div class="direction"></div>
<div class="error hidden" role="alert">图片未能载入，请重新选择视角。</div>
</div></section>
<nav class="views" aria-label="切换观察位置"></nav>
<div class="below"><div><p class="context" aria-live="polite"></p><div class="hint">左右键切换视角，C 键对照旧版。这里的操作仅用于查看场景。</div></div><div class="route-picker" aria-label="查看路线"><span class="label">调度总览</span><button data-route="all">全部</button><button data-route="fu">傅肜</button><button data-route="huang">黄权</button><button data-route="cheng">程畿</button><button data-route="sha">沙摩柯</button></div></div>
<details class="details"><summary>制作记录与源文件</summary><p>六张图以同一 Blender 场景的既定机位为构图参考，再用 imagegen 做写实精修。当前显示的是精修图片；三维源文件保留布局及模型细化，重新渲染不会直接复现图像精修的全部细节。人物名称表示军情方向。原版可逐视角对照，正式游戏剧情尚未接入。</p><p><a href="README.md">制作说明与生成提示词</a> · <a href="yiling-camp-v3.blend">Blender 源文件</a> · <a href="asset-provenance.json">三维资产来源</a></p></details>
</main><script>
const DATA=__DATA__;
const keys=['camp','river','east','south','imperial','overview'];
const TEXT={
camp:{title:'大本营',direction:'营中 · 北偏东',desc:'在集结营发令帐前，向营门和出营道路望去。',pins:[]},
river:{title:'营门望江',direction:'江面 · 北偏东',desc:'沿北门外的坡道到南岸渡口，黄权与程畿两路在登船后分开。',pins:['dock','north']},
east:{title:'东侧陆路',direction:'谷地 · 东',desc:'出东门后沿主路前行，到营外岔口再选择傅肜或沙摩柯方向。',pins:[]},
south:{title:'山路岔口',direction:'山路 · 东南',desc:'在营外岔口转入山路，沿两侧山坡之间的小路前往沙摩柯方向。',pins:[]},
imperial:{title:'高处望御营',direction:'瞭望台 · 西南',desc:'从集结营后侧回望刘备御营，两营之间有短路相连。',pins:['imperial']},
overview:{title:'调度总览',direction:'上方北岸 · 右侧东向',desc:'从大本营出发，两条陆路、两条水路在这里分别通往四个军情方向。',pins:['camp','imperial','dock','north','fu','huang','cheng','sha']}};
const ROUTES={all:'四路共用大本营；黄权与程畿两路共用营地至渡口的一段。',fu:'傅肜方向：出东门，沿江南谷地陆路前往。',huang:'黄权方向：先下坡到渡口，渡江后沿北岸道路前行。',cheng:'程畿方向：先下坡到渡口，登船后沿江寻找后船。',sha:'沙摩柯方向：出东门，到岔口后转入山路。'};
let current='camp',selected='all',showLabels=true,comparing=false,seq=0;const qs=s=>document.querySelector(s);
for(const key of keys){const b=document.createElement('button');b.className='view';b.dataset.view=key;b.setAttribute('aria-pressed','false');const im=document.createElement('img');im.src=DATA.cameras[key].image;im.alt='';const t=document.createElement('span');t.textContent=TEXT[key].title;b.append(im,t);b.onclick=()=>setView(key);qs('.views').append(b)}
function draw(){const cam=DATA.cameras[current],t=TEXT[current];qs('.marks').replaceChildren();qs('.routes').replaceChildren();qs('.marks').classList.toggle('hidden',!showLabels);qs('.routes').classList.toggle('hidden',!showLabels);
 if(current==='overview')for(const key of selected==='all'?['fu','sha','huang','cheng']:[selected]){
  const line=document.createElementNS('http://www.w3.org/2000/svg','polyline');line.setAttribute('points',cam.routes[key].map(p=>`${p.x*1920},${p.y*1080}`).join(' '));line.setAttribute('fill','none');line.setAttribute('stroke','#eee0b8');line.setAttribute('stroke-width',selected==='all'?2.5:4);line.setAttribute('stroke-dasharray','8 6');line.style.filter='drop-shadow(0 1px 2px #102014)';qs('.routes').append(line);
 }
 for(const key of t.pins){const p=cam.points[key];if(!p?.inFrame)continue;const b=document.createElement('button');b.className='pin'+(ROUTES[key]?'':' minor')+(selected===key?' active':'');b.style.left=p.x*100+'%';b.style.top=p.y*100+'%';b.textContent=p.label;b.onclick=()=>{if(ROUTES[key])setRoute(key);else setView(key==='camp'||key==='imperial'?key:'river')};qs('.marks').append(b)}
 qs('.place').textContent=t.title;qs('.direction').textContent=t.direction;qs('.version').textContent=comparing?'原结构版 · 对照中':'场景精修版';qs('.context').textContent=current==='overview'?ROUTES[selected]:t.desc;
 document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===current)));document.querySelectorAll('[data-route]').forEach(b=>b.setAttribute('aria-pressed',String(current==='overview'&&b.dataset.route===selected)));
}
function setView(key){current=key;const token=++seq;qs('#frame').classList.add('loading');qs('.error').classList.add('hidden');const src=comparing?'comparison-v2/'+key+'.png':DATA.cameras[key].image;const im=new Image();im.onload=()=>{if(token!==seq)return;qs('#scene').src=src;qs('#scene').alt=TEXT[key].title+(comparing?'原结构版':'精修场景');qs('#frame').classList.remove('loading');draw()};im.onerror=()=>{if(token!==seq)return;qs('.error').classList.remove('hidden')};im.src=src;}
function setRoute(key){selected=key;setView('overview')}
document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>setRoute(b.dataset.route));
qs('#compare').onclick=()=>{comparing=!comparing;qs('#compare').setAttribute('aria-pressed',String(comparing));qs('#compare').textContent=comparing?'返回精修版':'对照旧版';setView(current)};
qs('#labels-toggle').onclick=()=>{showLabels=!showLabels;qs('#labels-toggle').setAttribute('aria-pressed',String(showLabels));qs('#labels-toggle').textContent=showLabels?'隐藏标记':'显示标记';draw()};
qs('#fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await qs('#frame').requestFullscreen()}catch(e){qs('.error').textContent='当前环境无法进入全屏。';qs('.error').classList.remove('hidden')}};
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.altKey||e.metaKey)return;if(e.key.toLowerCase()==='c'){e.preventDefault();qs('#compare').click();return}if(!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();setView(keys[(keys.indexOf(current)+(e.key==='ArrowRight'?1:keys.length-1))%keys.length])});
setView('camp');
</script></body></html>
