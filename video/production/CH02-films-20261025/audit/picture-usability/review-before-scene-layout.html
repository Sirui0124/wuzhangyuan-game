<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第二章视频审阅</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f1e8;color:#252923;font:16px/1.6 system-ui,'Microsoft Yahei',sans-serif}main{max-width:1180px;margin:auto;padding:24px}header{display:flex;align-items:baseline;justify-content:space-between;gap:20px}h1{font-size:24px;margin:0}small,.muted{color:#72776d}select,button,textarea{font:inherit;border:1px solid #c5c9bd;border-radius:8px;background:#fffdf7;padding:9px 12px}select{min-width:220px;max-width:100%}nav{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}video{width:100%;aspect-ratio:16/9;background:#131815;border-radius:9px}h2{font-size:20px;margin:14px 0 4px}#empty{padding:90px 20px;text-align:center;background:#e5e7dd;border-radius:9px}#meta{font-size:14px;margin:5px 0 18px}details{margin:18px 0;border-top:1px solid #d5d7cd;padding-top:12px}summary{cursor:pointer}textarea{width:100%;height:96px;margin:8px 0}button{cursor:pointer}button:hover{background:#e9eee1}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.line{margin:8px 0}strong{font-weight:600}@media(max-width:600px){main{padding:16px}header{display:block}select{width:100%}nav{gap:8px}}</style>
<main><header><h1>第二章视频审阅</h1><small id="progress">读取制作进度…</small></header><nav><select id="group" aria-label="剧情段落"></select><select id="clip" aria-label="视频片段"></select><button id="refresh">刷新</button></nav><video id="video" controls playsinline preload="metadata"></video><div id="empty" hidden>这一段正在制作，完成后会出现在这里。</div><h2 id="title"></h2><p id="meta" class="muted">画面候选 · 配音最后统一处理</p><p id="picture-status" class="muted"></p><details><summary>查看画面复核总表</summary><a href="/audit/picture-usability/review.html" target="_blank">逐段可用性、接入条件与返修记录</a></details><details><summary>查看这一段的原文</summary><div id="lines"></div></details><details open><summary>这一段的修改意见</summary><textarea id="note" placeholder="例如：00:08 手穿过桌面；或这一段画面可以，声音最后换。"></textarea><div class="row"><small>意见保存在本机浏览器。</small><button id="export">导出修改意见</button></div></details></main>
<script>
let state,current='',pictureAudit={};const el=id=>document.getElementById(id);const key='ch2-film-notes-20261025';let notes=JSON.parse(localStorage.getItem(key)||'{}');
function fill(select,items,value){select.replaceChildren(...items.map(x=>{let o=document.createElement('option');o.value=x.value;o.textContent=x.label;return o}));if(items.some(x=>x.value===value))select.value=value}
function chooseGroup(keep){let g=state.groups.find(x=>x.group===el('group').value);fill(el('clip'),g.clips.map(c=>({value:c.id,label:(c.file?'可播放 · ':'制作中 · ')+c.name})),keep);choose()}
function choose(){let g=state.groups.find(x=>x.group===el('group').value),c=g.clips.find(x=>x.id===el('clip').value);current=c.id;el('title').textContent=c.name;el('meta').textContent=c.note;el('note').value=notes[current]||'';showPictureStatus(c);el('lines').replaceChildren(...c.lines.map(l=>{let p=document.createElement('p');p.className='line';let s=document.createElement('strong');s.textContent=l.speaker+'：';p.append(s,document.createTextNode(l.text));return p}));el('video').hidden=!c.file;el('empty').hidden=!!c.file;if(c.file){let url='/'+c.file;if(el('video').getAttribute('src')!==url){el('video').src=url;el('video').load()}}else{el('video').pause();el('video').removeAttribute('src')}}
function showPictureStatus(c){const a=pictureAudit[c.id],labels={'usable':'画面可用','usable-with-integration-condition':'画面可用，需满足接入条件','needs-repair':'画面需返修'};let msg='画面可用性正在复核';const stamp=c.file?new URL('/'+c.file,location.origin).searchParams.get('v'):null;if(a&&a.stamp&&a.mtimeNs===stamp&&a.pictureUsability){msg=labels[a.pictureUsability]||msg;const cs=a.integrationConditions||[];if(cs.length)msg+='：'+cs.map(x=>typeof x==='string'?x:JSON.stringify(x)).join('；');}el('picture-status').textContent=msg+'。配音待统一，尚未获用户审核通过。';}
async function refresh(){try{let r=await fetch('/data.json',{cache:'no-store'});if(!r.ok)throw Error();state=await r.json();pictureAudit={};try{let ar=await fetch('/audit/picture-usability/current.json',{cache:'no-store'});if(ar.ok){let a=await ar.json();pictureAudit=Object.fromEntries(a.clips.map(x=>[x.id,x]));}}catch(e){}let g=el('group').value,c=el('clip').value;fill(el('group'),state.groups.map(g=>({value:g.group,label:g.title})),g);el('progress').textContent=state.ready+' / '+state.total+' 段可播放 · '+state.updated;chooseGroup(c)}catch(e){el('progress').textContent='请通过本地审片服务打开：127.0.0.1:8894'}}
el('group').onchange=()=>chooseGroup();el('clip').onchange=choose;el('refresh').onclick=refresh;el('note').oninput=()=>{notes[current]=el('note').value;localStorage.setItem(key,JSON.stringify(notes))};el('export').onclick=()=>{let rows=['# 第二章视频修改意见',''];for(let g of state.groups)for(let c of g.clips)if(notes[c.id])rows.push('## '+c.name+'（'+c.id+'）','',notes[c.id],'');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/markdown;charset=utf-8'}));a.download='第二章视频修改意见.md';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};refresh();setInterval(()=>{if(el('video').paused)refresh()},30000);
</script></html>
