<meta charset="utf-8"><title>G2逐片动态审片</title><style>body{margin:0;background:#101516;color:#eee;font:18px sans-serif}header{padding:12px}video{width:100vw;height:85vh}select{font-size:18px;max-width:800px}</style><header><select id="pick" onchange="play(this.value)"><option value="V13-01">V13-01 仓中核凭据、获准查账</option><option value="V13-02">V13-02 仓中核凭据、获准查账</option><option value="V13-03">V13-03 仓中核凭据、获准查账</option><option value="V13-04">V13-04 仓中核凭据、获准查账</option><option value="V14-01">V14-01 粮运画卷</option><option value="V14-02">V14-02 粮运画卷</option><option value="V15-01">V15-01 倒查起点与三份账页</option><option value="V15-02">V15-02 倒查起点与三份账页</option><option value="V15-03">V15-03 倒查起点与三份账页</option><option value="V15-04">V15-04 倒查起点与三份账页</option><option value="V16A-01">V16A-01 核交接选项</option><option value="V16B-01">V16B-01 去问损耗与认罪</option><option value="V16B-02">V16B-02 去问损耗与认罪</option><option value="V16C-01">V16C-01 先行归责与纠正</option><option value="V16C-02">V16C-02 先行归责与纠正</option><option value="V17-01">V17-01 共同交付核对</option><option value="V18-01">V18-01 入仓、实收、应征连续核对</option><option value="V18-02">V18-02 入仓、实收、应征连续核对</option><option value="V18-03">V18-03 入仓、实收、应征连续核对</option><option value="V18-04">V18-04 入仓、实收、应征连续核对</option><option value="V18-05">V18-05 入仓、实收、应征连续核对</option><option value="V18-06">V18-06 入仓、实收、应征连续核对</option><option value="V19A-01">V19A-01 缺额判断A</option><option value="V19A-02">V19A-02 缺额判断A</option><option value="V19B-01">V19B-01 缺额判断B</option><option value="V19C-01">V19C-01 缺额判断C</option><option value="V19C-02">V19C-02 缺额判断C</option><option value="V20-01">V20-01 调度决定与受杖前签认</option><option value="V20-02">V20-02 调度决定与受杖前签认</option><option value="V20-03">V20-03 调度决定与受杖前签认</option><option value="V20-04">V20-04 调度决定与受杖前签认</option><option value="V20-05">V20-05 调度决定与受杖前签认</option><option value="V20-06">V20-06 调度决定与受杖前签认</option><option value="V20-07">V20-07 调度决定与受杖前签认</option><option value="V20-08">V20-08 调度决定与受杖前签认</option></select> <button onclick="v.play()">播放</button> <button onclick="v.pause()">暂停</button><button id="auto" onclick="startAuto()">连续检查已到片段</button><span id="t"></span></header><video id="v" controls muted></video><pre id="audit" style="white-space:pre-wrap;font-size:13px"></pre><script>
let automatic=false;const completed=new Set();let current='';
function play(id){current=id;pick.value=id;v.src="generated/"+id+"-raw.mp4";v.play()}
function log(s){audit.textContent+=s+'\n'}
v.ontimeupdate=()=>t.textContent=v.currentTime.toFixed(2)+" / "+v.duration.toFixed(2);
v.onended=()=>{completed.add(current);log(JSON.stringify({id:current,event:'ended',duration:v.duration,time:new Date().toISOString()}));if(automatic)nextAuto()};
v.onerror=()=>{if(automatic)setTimeout(nextAuto,2000)};
async function startAuto(){automatic=true;await nextAuto()}
async function nextAuto(){
 if(!automatic)return;
 for(const o of pick.options){if(completed.has(o.value))continue;const r=await fetch('generated/'+o.value+'-technical.json',{cache:'no-store'});if(r.ok){play(o.value);return}}
 if(completed.size<pick.options.length)setTimeout(nextAuto,3000);else{log('全部已到片段完成自然速度播放；声音静音，不能作为听审。');automatic=false}
}
play(pick.value)</script>
