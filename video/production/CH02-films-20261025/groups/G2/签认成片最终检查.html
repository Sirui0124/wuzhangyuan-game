<!doctype html><meta charset="utf-8"><title>G2 成片动态检查</title><style>body{background:#141a19;color:#eee;margin:0;font:17px sans-serif}header{padding:10px}video{width:100%;height:84vh}pre{font-size:12px;white-space:pre-wrap}</style><header><select id="pick" onchange="play(pick.selectedIndex)"><option value="V20-调度决定与受杖前签认-画面候选-a3c11d59.mp4" data-id="V20">V20 调度决定与受杖前签认</option></select><button onclick="v.play()">播放</button><button id="auto" onclick="automatic=true;play(0)">顺序检查成片</button><span id="time"></span></header><video id="v" controls muted></video><pre id="audit"></pre><script>
let automatic=false,index=0;
function play(i){index=i;pick.selectedIndex=i;v.src='assembled/'+pick.options[i].value;v.play()}
v.ontimeupdate=()=>time.textContent=v.currentTime.toFixed(2)+' / '+v.duration.toFixed(2);
v.onended=()=>{audit.textContent+=JSON.stringify({id:pick.options[index].dataset.id,file:pick.options[index].value,event:'ended',duration:v.duration,time:new Date().toISOString()})+'\n';if(automatic&&index+1<pick.options.length)play(index+1);else if(automatic)audit.textContent+='本页全部成片已完成自然速度静音播放。\n'};
play(0)</script>
