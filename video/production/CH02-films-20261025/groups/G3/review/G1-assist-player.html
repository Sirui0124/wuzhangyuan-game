<!doctype html><meta charset="utf-8"><title>G1只读协助审片</title><style>body{background:#151515;color:#eee;font:16px sans-serif}video{width:1000px;max-width:95vw}pre{white-space:pre-wrap}button{padding:12px}</style><h2>G1本地只读审片</h2><button id="go">播放本批</button><video controls muted id="v"></video><pre id="s"></pre><pre id="log"></pre><script>
let clips=[{"id": "L01-01", "file": "/G1/generated/L01-01-raw.mp4"}, {"id": "V11T-01", "file": "/G1/generated/V11T-01-raw.mp4"}, {"id": "V11D-01", "file": "/G1/generated/V11D-01-raw.mp4"}, {"id": "V11R-01", "file": "/G1/generated/V11R-01-raw.mp4"}, {"id": "V11A-01", "file": "/G1/generated/V11A-01-raw.mp4"}, {"id": "V11N-01", "file": "/G1/generated/V11N-01-raw.mp4"}, {"id": "V12-01", "file": "/G1/generated/V12-01-raw.mp4"}, {"id": "V12-02", "file": "/G1/generated/V12-02-raw.mp4"}, {"id": "V12-03", "file": "/G1/generated/V12-03-raw.mp4"}];let q=new URLSearchParams(location.search).get('only');if(q)clips=clips.filter(c=>q.split(',').includes(c.id));let i=0,v=document.querySelector('video'),log=[];
function play(){v.src=clips[i].file;v.play()};document.querySelector('button').onclick=play;
v.addEventListener('ended',()=>{let played=[];for(let j=0;j<v.played.length;j++)played.push([v.played.start(j),v.played.end(j)]);log.push({...clips[i],duration:v.duration,played,ended:true});document.querySelector('#log').textContent=JSON.stringify(log,null,2);i++;if(i<clips.length)play()});setInterval(()=>document.querySelector('#s').textContent=(clips[Math.min(i,clips.length-1)]?.id||'')+' '+v.currentTime.toFixed(2)+' / '+(v.duration||0).toFixed(2)+' '+(v.ended?'ended':v.paused?'paused':'playing'),100);
</script>
