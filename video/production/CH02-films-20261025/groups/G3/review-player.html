<!doctype html><html lang="zh"><meta charset="utf-8"><title>G3制作自查播放器</title><style>body{margin:20px;background:#151515;color:#eee;font:16px sans-serif}video{width:min(1100px,94vw);display:block;background:#000}button,select{font:inherit;margin:8px;padding:8px}#state{white-space:pre-wrap}</style>
<h2>G3 制作自查播放器</h2><select id="pick"></select><button id="load">加载</button><button id="adopt">采用片</button><button id="play">播放</button><button id="pause">暂停</button><button id="next">下一段</button><button id="continuous">连续检查（静音）</button><button id="films">逻辑成片检查（静音）</button><video muted controls preload="metadata" id="v"></video><p id="state"></p><p id="source"></p><pre id="checked"></pre>
<script>
let clips=[],index=0,v=document.getElementById('v'),pick=document.getElementById('pick');
async function init(){let p=await(await fetch('plan.json')).json();clips=p.clips;for(let c of clips){let o=document.createElement('option');o.value=c.id;o.textContent=c.id+' '+c.duration+'秒 '+(c.postVoiceOnly?'中央玩家后期音轨':'NPC/动作');pick.append(o)}let q=new URLSearchParams(location.search);if(q.get('clip'))pick.value=q.get('clip');if(q.get('film')){let d=await(await fetch('delivery.json')).json();let c=d.logicalClips.find(c=>c.id===q.get('film')&&c.path);if(c){reviewQueue=[{id:c.id,file:c.path}];reviewPos=0;playbackLog=[];playQueued();return}}load()}
function load(){index=clips.findIndex(c=>c.id===pick.value);if(index<0)return;let c=clips[index];v.src='generated/'+c.id+'-raw.mp4';document.getElementById('source').textContent=c.sourceLines.map(l=>l.node+' '+l.speaker+'：'+l.text).join(' / ')}
document.getElementById('load').onclick=load;document.getElementById('play').onclick=()=>v.play();document.getElementById('pause').onclick=()=>v.pause();document.getElementById('next').onclick=()=>{pick.selectedIndex=(pick.selectedIndex+1)%clips.length;load();v.play()};
document.getElementById('adopt').onclick=async()=>{let d=await(await fetch('review/decisions.json')).json();let p=d[pick.value]?.adoptPath;v.src=p?'edited/'+p.replaceAll('\\','/').split('/').pop():'edited/'+pick.value+'-16x9.mp4';document.getElementById('source').textContent+=' ｜采用构图片'};
let reviewQueue=[],reviewPos=0,playbackLog=[];
function playQueued(){let c=reviewQueue[reviewPos];if(![...pick.options].some(o=>o.value===c.id)){let o=document.createElement('option');o.value=c.id;o.textContent=c.id+' 逻辑整段';pick.append(o)}pick.value=c.id;let path=c.file.replaceAll('\\','/');v.src=path.slice(path.indexOf('/G3/')+4);document.getElementById('source').textContent=c.id+' 连续动态检查 '+(reviewPos+1)+'/'+reviewQueue.length;v.muted=true;v.play()}
document.getElementById('continuous').onclick=async()=>{let d=await(await fetch('delivery.json')).json();reviewQueue=d.subclips;reviewPos=0;playbackLog=[];playQueued()};
document.getElementById('films').onclick=async()=>{let d=await(await fetch('delivery.json')).json();reviewQueue=d.logicalClips.filter(c=>c.status==='candidate').map(c=>({id:c.id,file:c.path}));reviewPos=0;playbackLog=[];playQueued()};
v.addEventListener('ended',()=>{if(!reviewQueue.length)return;let ranges=[];for(let i=0;i<v.played.length;i++)ranges.push([v.played.start(i),v.played.end(i)]);playbackLog.push({id:reviewQueue[reviewPos].id,file:reviewQueue[reviewPos].file,duration:v.duration,played:ranges,ended:true});document.getElementById('checked').textContent=JSON.stringify(playbackLog,null,2);reviewPos++;if(reviewPos<reviewQueue.length)playQueued();else{reviewQueue=[];document.getElementById('source').textContent='本批连续播放结束；仅图像播放验证，非听审'}});
setInterval(()=>document.getElementById('state').textContent=pick.value+'｜实际播放 '+v.currentTime.toFixed(2)+' / '+(v.duration||0).toFixed(2)+' 秒｜'+(v.paused?'暂停':'播放中')+'｜'+(v.ended?'已播完':'未结束')+'｜媒体状态 '+v.readyState,100);init();
</script></html>
