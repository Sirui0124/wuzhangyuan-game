<!doctype html><meta charset="utf-8"><title>G6用户新标准复查</title>
<style>body{background:#10171a;color:#eee;font:18px system-ui;margin:12px}video{width:100%;max-height:82vh}button,select{font:inherit;margin:8px}#time{font:18px monospace}</style>
<select aria-label="新标准复查片段"></select><button id="play">从头播放</button><button id="pause">暂停</button><div id="time"></div><video controls muted preload="auto"></video>
<script>let rows=[];const v=document.querySelector('video'),s=document.querySelector('select');fetch('playback-manifest.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{rows=d;for(const r of d){let o=document.createElement('option');o.value=r.id;o.textContent=r.id+' '+r.name;s.append(o)}load()});function load(){let r=rows.find(r=>r.id===s.value);v.src='/groups/G6/'+r.oldFile.replaceAll('\\','/').split('/G6/')[1]+'?new-standard-20261025'}s.onchange=load;document.querySelector('#play').onclick=()=>{v.currentTime=0;v.play()};document.querySelector('#pause').onclick=()=>v.pause();setInterval(()=>document.querySelector('#time').textContent=s.value+' '+v.currentTime.toFixed(3)+' / '+v.duration+' '+(v.ended?'已结束':v.paused?'暂停':'播放中'),100)</script>
