<!doctype html><meta charset="utf-8"><title>G6六段最终动态检查</title>
<style>body{margin:12px;background:#11191c;color:#eee;font:16px system-ui}button{font:inherit;padding:8px}main{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}video{width:100%;display:block;background:#000}h3{font:16px system-ui;margin:6px 0}.time{font:15px monospace;color:#adccce}</style>
<button id="start">全部从头播放</button> <span>六段画面检查｜本页静音，不修改影片原音轨｜音频待统一</span><main></main>
<script>fetch('delivery.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{for(const f of d.films){let a=document.createElement('article'),h=document.createElement('h3'),v=document.createElement('video'),s=document.createElement('div');h.textContent=f.id+' '+f.name;v.src=f.path.replaceAll('\\','/').split('/G6/')[1];v.muted=true;v.preload='auto';v.controls=true;s.className='time';a.append(h,v,s);document.querySelector('main').append(a);setInterval(()=>s.textContent=v.currentTime.toFixed(2)+' / '+(isFinite(v.duration)?v.duration.toFixed(2):'?')+(v.ended?' 已结束':v.paused?' 暂停':' 播放中'),100)}});document.querySelector('#start').onclick=()=>{for(const v of document.querySelectorAll('video')){v.currentTime=0;v.play()}};</script>
