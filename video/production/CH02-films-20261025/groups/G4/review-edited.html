<!doctype html><meta charset="utf-8"><title>G4 逐片审阅</title><style>body{background:#151719;color:#eee;font:16px sans-serif;margin:20px}video{width:min(1100px,95vw);max-height:70vh;background:#000}button,select{padding:10px;margin:5px}#note{max-width:1100px;line-height:1.8}</style><h2>G4 制作自查｜待用户 review</h2><select id="clips"></select><button id="play">从头播放</button><button id="next">下一条</button><span id="state"></span><br><video id="film" controls preload="metadata"></video><p id="note"></p><script>
const data=[{"id": "V26-01", "slot": "V26", "src": "edited/V26-01.mp4", "expected": "我先回去交差，把实收和欠缺的粮数报清楚。", "silent": false}, {"id": "V26-02", "slot": "V26", "src": "edited/V26-02.mp4", "expected": "我返营交差，军吏核收本次获准查阅的粮情材料。", "silent": true}, {"id": "V26-03", "slot": "V26", "src": "edited/V26-03.mp4", "expected": "缺额、民食和种粮的情况，一并列明。", "silent": false}, {"id": "V26-04", "slot": "V26", "src": "edited/V26-04.mp4", "expected": "敌方正在修整粮道、筹集军资，并恢复屯田。", "silent": true}, {"id": "V26-06", "slot": "V26", "src": "edited/V26-06.mp4", "expected": "眼下看到的是这些。来年谁强谁弱，还说不准。", "silent": false}, {"id": "V26-07", "slot": "V26", "src": "edited/V26-07.mp4", "expected": "丞相看过这批粮情，答的是此次粮乏，当退。", "silent": false}, {"id": "V26-08", "slot": "V26", "src": "edited/V26-08.mp4", "expected": "他担心休兵这段日子，魏军修田积粮，将来更难打。", "silent": false}, {"id": "V27-01", "slot": "V27", "src": "edited/V27-01.mp4", "expected": "我将简报中可转述的消息带回伤帐。", "silent": true}];
const s=document.querySelector('#clips'),v=document.querySelector('#film');let idx=0;
for(const c of data){const o=document.createElement('option');o.value=c.id;o.textContent=c.id;s.append(o)}
function choose(i){idx=i;const c=data[i];s.value=c.id;v.src=c.src;document.querySelector('#note').textContent=(c.silent?'无固定人声｜':'原对白｜')+c.expected;}
s.onchange=()=>choose(data.findIndex(c=>c.id===s.value));document.querySelector('#play').onclick=()=>{v.currentTime=0;v.play()};document.querySelector('#next').onclick=()=>{choose((idx+1)%data.length);v.play()};
v.ontimeupdate=()=>document.querySelector('#state').textContent=data[idx].id+' ｜ '+v.currentTime.toFixed(2)+' / '+v.duration.toFixed(2)+' 秒 ｜ '+(v.paused?'暂停':'播放中');if(data.length)choose(0);
</script>
