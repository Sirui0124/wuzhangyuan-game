<!doctype html><meta charset="utf-8"><title>G4 逐片审阅</title><style>body{background:#151719;color:#eee;font:16px sans-serif;margin:20px}video{width:min(880px,95vw);height:auto;background:#000}button,select{padding:10px;margin:5px}#note{max-width:1100px;line-height:1.8}</style><h2>G4 制作自查｜待用户 review</h2><select id="clips"></select><button id="play">从头播放</button><button id="next">下一条</button><button id="queue">逐条播放（审片）</button><span id="state"></span><br><video id="film" controls preload="metadata"></video><p id="note"></p><p id="history"></p><script>
const data=[{"id": "V26", "src": "assembled/V26-返营交差与军情说明.mp4", "expected": "我先回去交差，把实收和欠缺的粮数报清楚。 / 我返营交差，军吏核收本次获准查阅的粮情材料。 / 缺额、民食和种粮的情况，一并列明。 / 敌方正在修整粮道、筹集军资，并恢复屯田。 / 那我们退了，他们也还会继续准备？ / 眼下看到的是这些。来年谁强谁弱，还说不准。 / 丞相看过这批粮情，答的是此次粮乏，当退。 / 他担心休兵这段日子，魏军修田积粮，将来更难打。 / 兴复汉室是他许下的诺言。他也担心，蜀汉守着这一隅，究竟能撑多久。", "silent": false}, {"id": "V30", "src": "assembled/V30-第二次定制交谈的提问.mp4", "expected": "该说的，我已经说了。你现在准备拿我怎么办？", "silent": false}, {"id": "L02", "src": "assembled/L02-定制②听者反应底片-闭口有效段.mp4", "expected": "", "silent": true}, {"id": "V31T", "src": "assembled/V31T-定制②回应T.mp4", "expected": "那你何必还来问我。要怎么做，你自己定。", "silent": false}, {"id": "V31D", "src": "assembled/V31D-定制②回应D.mp4", "expected": "你肯护我，我记着。可压下这些，就真能把事情停住？", "silent": false}, {"id": "V31R", "src": "assembled/V31R-定制②回应R.mp4", "expected": "你想帮我，我听见了。可说到案前，哪一句拿得出凭据？", "silent": false}, {"id": "V31A", "src": "assembled/V31A-定制②回应A.mp4", "expected": "办法我听见了。接下来怎么做，你来定。", "silent": false}, {"id": "V31N", "src": "assembled/V31N-定制②回应N.mp4", "expected": "你想怎么做，说吧。我听着。", "silent": false}, {"id": "V32R", "src": "assembled/V32R-补救遭拒.mp4", "expected": "你说得容易。我现在不能把命押在这个办法上。", "silent": false}];
const s=document.querySelector('#clips'),v=document.querySelector('#film');let idx=0;
let queue=false;const history=JSON.parse(localStorage.getItem(location.pathname+'-played')||'[]');document.querySelector('#history').textContent='已完整播放：'+history.join('、');
for(const c of data){const o=document.createElement('option');o.value=c.id;o.textContent=c.id;s.append(o)}
function choose(i){idx=i;const c=data[i];s.value=c.id;v.src=c.src;document.querySelector('#note').textContent=(c.silent?'无固定人声｜':'原对白｜')+c.expected;}
s.onchange=()=>choose(data.findIndex(c=>c.id===s.value));document.querySelector('#play').onclick=()=>{v.currentTime=0;v.play()};document.querySelector('#next').onclick=()=>{choose((idx+1)%data.length);v.play()};document.querySelector('#queue').onclick=()=>{queue=true;const n=data.findIndex(c=>!history.includes(c.id));if(n>=0){choose(n);v.play()}};
v.onended=()=>{const id=data[idx].id;if(!history.includes(id))history.push(id);localStorage.setItem(location.pathname+'-played',JSON.stringify(history));document.querySelector('#history').textContent='已完整播放：'+history.join('、');if(queue){const n=data.findIndex(c=>!history.includes(c.id));if(n>=0){choose(n);v.play()}else{queue=false}}};
v.ontimeupdate=()=>document.querySelector('#state').textContent=data[idx].id+' ｜ '+v.currentTime.toFixed(2)+' / '+v.duration.toFixed(2)+' 秒 ｜ '+(v.paused?'暂停':'播放中');if(data.length)choose(0);
</script>
