<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>夷陵 · 前线军令</title><script>if(location.port==="8956")location.replace("http://127.0.0.1:8812/?chapter=yiling&playtest=command");</script><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/ui-heavy.css"><link rel="stylesheet" href="/ending-report.css"></head><body>
<main class="desk" id="desk">
<header><div class="title">夷陵<span>前线军图</span></div><div class="header-actions"><button id="campaign-map">舆图</button><button id="about">军令与营救</button><button id="reset">重新体验</button></div></header>
<section class="map" aria-label="前线军图"><div class="map-world" id="map-world"><img src="/terrain.png" alt="夷陵山川实景地形军图" draggable="false"><svg class="map-routes" viewBox="0 0 1080 360" preserveAspectRatio="none" aria-hidden="true"><g id="routes"></g></svg><div id="places"></div></div><button id="fu-map-status" data-front="fu" class="fu-map-status" hidden>傅肜 · 已脱险，待归营</button><aside id="field-guide" class="field-guide" aria-label="新手引导" hidden><div class="guide-copy" role="status"><strong id="guide-title"></strong><p id="guide-text"></p></div><div class="guide-controls"><button id="guide-action"></button><button id="guide-dismiss" aria-label="跳过剩余引导">跳过引导</button></div></aside><div id="round-banner" class="round-banner" role="status" hidden></div><div class="map-note">位置以收到的军报为准</div></section>
<div class="divider"><div id="resize" role="separator" aria-label="拖动或用上下方向键调整地图高度" aria-orientation="horizontal" tabindex="0" aria-valuemin="160" aria-valuemax="360" aria-valuenow="330"><span></span></div><button id="layout-toggle" aria-expanded="false">展开军报 ↓</button></div>
<section class="work">
<nav id="contacts" class="tabs contact-rail" aria-label="联络人物"></nav>
<section class="conversation" aria-label="前线对话">
<div class="conversation-head"><div class="filter-bar"><button id="filter-current" aria-pressed="true">沙摩柯往来</button><button id="filter-all" aria-pressed="false">所有传令</button><span id="filter-hint" role="status"></span><span id="compact-countdown" hidden></span></div>
<div id="fu-status" class="fu-status" hidden role="status"><span id="fu-network"></span><button id="fu-refresh">读取最新状态</button><button id="fu-retry" hidden>重试上次请求</button></div><button id="open-situation" aria-controls="command-panel" aria-expanded="false">军情调度</button></div>

<section class="reports" aria-label="往来军报"><div id="log" tabindex="0" aria-label="军报记录"></div><button id="new-reports" hidden>有新军报 ↓</button></section>
<div id="conflict" hidden></div>

<section class="composer" aria-label="问话与传令"><nav id="suggestions" class="suggestions" aria-label="可以这样问" hidden></nav><div class="input-shell"><div class="command-launch"><button id="mode-toggle" class="command-tally" aria-label="切换为传令" aria-pressed="false" aria-expanded="false" aria-controls="dispatch-address" title="切换为传令"><span class="tally-seal" aria-hidden="true">令</span><span id="mode-label">传令</span><span class="mode-arrow" aria-hidden="true">⇄</span></button></div><div class="compose-scroll"><div id="preview" hidden></div><div id="dispatch-address" class="dispatch-address" hidden><label>派遣队伍<select id="order-unit"><option value="auto">自动识别</option></select></label><span aria-hidden="true">→</span><label>接应对象<select id="order-target"><option value="auto">自动识别</option><option value="sha">沙摩柯</option><option value="camp">冯习·张南</option><option value="fu">傅肜</option></select></label></div><label id="draft-label" for="draft" class="sr-only">向前线问话</label><textarea id="draft" maxlength="500" rows="1" placeholder="想问什么，直接写下来……"></textarea><p id="intent-summary" hidden role="status"></p></div><div class="compose-actions"><button id="suggest" class="text-action" hidden>取消复诵</button><div id="send-home"><button id="send" class="primary">传话</button></div></div></div><p id="feedback" role="status"></p></section>
</section>
<aside class="command-panel" id="command-panel" aria-label="军情与调遣"><div class="panel-head"><h2 id="panel-title">军情调度</h2><button id="close-command" hidden>返回军情</button></div><section id="round-clock" class="round-clock" aria-label="营救时辰进度"></section><div class="panel-scroll">
<div id="army-summary"><div id="army-roster"></div></div>

</div><div id="fu-round-actions" class="fu-round-actions" hidden><button id="fu-end-round" class="primary">结束本轮</button><button id="campaign-next" class="primary" hidden>返回第四章</button></div><section class="time-status"><span id="round-action-note">推进两个时辰</span><button id="review-round" hidden>重看军报</button><button id="review-ending" hidden>结局军报</button><strong id="command-countdown" hidden></strong></section>
</aside>
</section><footer><span id="mode-note">联络前线，了解各路处境</span><span>Ctrl + Enter 发送 · 输入内容自动保留</span></footer>
</main><dialog id="round-report" class="round-report" aria-labelledby="round-report-title"><div class="report-heading"><span>前 线 军 报</span><h2 id="round-report-title"></h2></div><div id="round-report-body"></div><form method="dialog"><button class="primary">阅毕</button></form></dialog><dialog id="info" aria-labelledby="guide-heading"><h2 id="guide-heading">接应前线，带他们回来</h2><p>前线仍有人困在撤路上。先问清处境，再安排接应，尽量少让弟兄折损。</p><ol class="guide-overview"><li>看军图，了解各路困境</li><li>问前线，商量撤离办法</li><li>传军令，确认后推进本轮</li></ol><p class="guide-rule">按本局时限安排接应。每组每轮最多交谈八次，传令不占次数。结束本轮推进两个时辰；接应人马在解围前继续作战；解围后再过一轮归营。</p><div class="guide-buttons"><button id="skip-info">自行探索</button><button id="close-info" class="primary">跟随引导</button></div></dialog><dialog id="reset-dialog"><h2>新开营救</h2><p>从甲队500人、预备兵2000人重新开始。旧局与旧版存档保留。</p><label>难度 <select id="difficulty"><option value="easy">从容</option><option value="normal" selected>标准</option><option value="hard">险局</option></select></label><button id="cancel-reset">继续当前</button><button id="confirm-reset" class="primary">开始新局</button></dialog><dialog id="front-story" class="front-story" aria-labelledby="story-title"><div class="story-head"><h2 id="story-title"></h2><span id="story-crisis"></span><button id="close-story" aria-label="关闭部队介绍">关闭</button></div><figure><img id="story-image" alt=""><figcaption id="story-caption"></figcaption></figure><h3 id="story-heading"></h3><p id="story-text"></p><p id="story-current"></p><div class="story-actions"><button id="story-talk" class="primary">联络这一路</button></div></dialog><script type="module" src="/app.js"></script></body></html>
