<!doctype html><html lang="zh-CN" data-ui-theme="xuan" data-art-style="film" data-art-font="serif"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>夷陵 · 归路</title><link rel="stylesheet" href="/dialogue-ink.css"><link rel="stylesheet" href="/style.css"></head><body><main id="game-root"><header><div class="brand"><span>归</span><h1>夷陵 · 归路</h1></div><details id="versions"><summary>试玩设置</summary><div class="version-panel"><p>四路共用2500人、一支船队与故事时间。</p><button id="new">重新开始这次接应</button><small id="health"></small><small>刷新会恢复本机服务中的这局；服务重启后需重新开始。</small></div></details></header>
<div class="command-bar"><div class="stats"><span id="troops"></span><span id="boats"></span><span id="clock"></span></div><div class="bar"><button id="speed">1×</button><button id="pause">继续行动</button></div></div>
<section class="board"><div class="board-title"><span>夷陵接应舆图</span><span id="situation">点击人物的军情，再决定如何调兵。</span></div><div class="map-scroll"><div class="map"><img src="/art/map.png" alt="夷陵四路接应舆图"><svg id="map-routes" viewBox="0 0 1000 562.5" preserveAspectRatio="none" aria-hidden="true"></svg><div id="map-labels"></div></div></div><div class="board-foot"><span id="board-note">营中待命 · 尚未发令</span><span>示意舆图</span></div></section>
<section class="army"><div class="army-title"><span>接应队伍</span><small>点击地图人物查看军情，确认调遣后出发。</small></div><div id="units" class="units"></div></section><p id="status" role="status"></p><p id="message" role="alert"></p>
<section id="finish" hidden><h2>四路接应的回报</h2><p id="result"></p><details><summary>留下试玩感受</summary><div class="feedback-fields"><label>顺手程度<select id="rating"><option value="">暂不评分</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><label>趣味<select id="fun"><option value="">暂不评分</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><label>愿意继续？<select id="continue"><option>不确定</option><option>是</option><option>否</option></select></label><button id="save">保存</button><button id="export">导出本机记录</button></div></details></section>
<div id="event" class="overlay" hidden><section class="event-panel" role="dialog" aria-modal="true" aria-label="传来的军情"><div class="event-top"><span id="event-location"></span><span>全场暂停</span><button id="close-event">收起，查看舆图</button></div><div id="hero" class="game-scene" data-phase="dialogue"><img id="scene-image" class="scene-image" alt=""><div class="scene-shade"></div><p id="caption"></p><div class="dialogue-box"><div id="speaker" class="dialogue-speaker"></div><div class="dialogue-reading"><p id="spoken" class="dialogue-text"></p></div></div><button id="next">继续 ▷</button></div><div id="event-controls">
<div id="inquiry" hidden><div id="ask-box"><textarea id="question" rows="2" maxlength="600" aria-label="想问什么" placeholder="想先问清什么？"></textarea><div class="bar"><small id="questions-left"></small><button id="ask">问一问</button></div></div><button id="choices-show" class="primary">看接应办法</button></div><details id="questions-history" hidden><summary>刚才的问答</summary><div id="question-log"></div></details>
<div id="selection" hidden><p id="shared-notices"></p><div id="options" class="options"></div><button id="return-map" class="quiet">再听听其他军情</button><button id="back-ask" class="quiet">再问一句</button></div><div id="review" hidden><p id="my-line"></p><p id="plan"></p><div class="dispatch-row"><span id="required-units"></span><button id="execute" class="primary">确认调遣</button><button id="revise">换个办法</button></div></div><p id="event-message" role="alert"></p><p id="event-status" role="status"></p>
</div></section></div></main><script type="module" src="/app.js"></script></body></html>
