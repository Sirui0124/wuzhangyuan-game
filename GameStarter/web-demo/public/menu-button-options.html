<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>主界面按钮 · 四款对照</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101716;color:#e8dfcc;font:14px/1.6 'Microsoft YaHei',sans-serif}header{max-width:1500px;margin:auto;padding:24px 26px 18px}h1{margin:0;font-size:23px;font-weight:500;letter-spacing:2px}header p{color:#a9b4a9;margin:7px 0 12px}select{background:#202b28;color:#e8dfcc;border:1px solid #80765c;padding:7px 12px}main{display:grid;grid-template-columns:1fr 1fr;gap:22px;padding:0 26px 28px;max-width:1500px;margin:auto}article{border:1px solid #75684a66;overflow:hidden;border-radius:4px}article[hidden]{display:none}.caption{padding:13px 18px;background:#1c2522}.caption h2{margin:0;font-size:18px;font-weight:500}.caption p{margin:3px 0 0;color:#aeb6aa;font-size:12px}.scene{height:440px;position:relative;background:linear-gradient(90deg,#09121180,transparent),url('/main-menu-background-v01.jpg') center/cover}.menu{position:absolute;left:6%;top:24px;width:55%;max-width:370px;text-align:center}.logo{height:130px;width:100%;object-fit:contain}.tagline{margin:0 0 17px;font:13px 'KaiTi',serif;letter-spacing:3px;color:#ded2b6}nav{display:grid;gap:10px}.choice{position:relative;isolation:isolate;width:100%;height:53px;display:grid;place-items:center;padding:0 35px;border:0;background:none;color:#e8dfc9;font:23px/1.4 'KaiTi','STKaiti',serif;letter-spacing:5px;text-shadow:0 2px 3px #000;cursor:pointer;transition:filter .18s,transform .18s}.choice:before{content:'';position:absolute;inset:0;z-index:-1;background:url('/main-menu-button-idle-v02.png') center/100% 255% no-repeat}.choice:first-child{color:#34281b;text-shadow:0 1px 1px #fff6}.choice:first-child:before{background-image:url('/main-menu-button-active-v02.png')}.choice:hover{filter:brightness(1.15);transform:translateY(-2px)}.choice:active{transform:translateY(1px)}.choice:focus-visible{outline:2px solid #e9cb8f;outline-offset:3px}
/* A: the first delivered, fully ornamented bronze frame. */
.a .choice:before{filter:drop-shadow(0 4px 4px #0007)}
/* B: narrow chamfered plaque with engraved corner frets and small side finials. */
.b .choice:before{background-size:122% 340%;clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px)}
.b .choice:after{content:'';position:absolute;inset:0;pointer-events:none;background:#c2a370;mask:url('/ui/menu-plaque-frame.svg') center/100% 100% no-repeat}
.b .choice:first-child:after{background:#73542e}.b .choice i{position:absolute;left:3px;top:22px;width:8px;height:8px;border:1px solid #bba06b;background:#273029;transform:rotate(45deg)}.b .choice i:last-child{left:auto;right:3px}
/* C: warm silk scroll, fine turned ends and ink-colored lettering. */
.c .choice{color:#4e3c27;text-shadow:0 1px 1px #fff6}
.c .choice:before{inset:2px 5px;background-image:linear-gradient(#ebdfbd55,#a9936844),url('/main-menu-button-active-v02.png');background-size:100% 100%,124% 340%;border-top:1px solid #d9c69c;border-bottom:1px solid #8b7351;border-radius:5px;box-shadow:0 3px 5px #0006}
.c .choice:first-child:before{background-image:linear-gradient(#e9c56b44,#bf8d3b33),url('/main-menu-button-active-v02.png')}
.c .choice:after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,#5d4b2c,#d5c39b 45%,#6e5731);width:7px;border-radius:3px;box-shadow:1px 0 2px #0007}.c .choice i{position:absolute;right:0;top:0;bottom:0;width:7px;background:linear-gradient(90deg,#6e5731,#d5c39b 55%,#5d4b2c);border-radius:3px;box-shadow:-1px 0 2px #0007}
/* D: dark lacquer, restrained cinnabar primary, gold corner cuts. */
.d .choice{color:#e7d8b8}.d .choice:before{background-image:linear-gradient(#10201cc9,#0b1713aa),url('/main-menu-button-idle-v02.png');background-size:100% 100%,122% 340%;border:1px solid #9c8557;outline:1px solid #8f794a40;outline-offset:-4px;clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px),0 8px)}.d .choice:first-child{color:#f3dfb1;text-shadow:0 1px 3px #251009}.d .choice:first-child:before{background-image:linear-gradient(#863e2dd9,#51251ee6),url('/main-menu-button-idle-v02.png');border-color:#c8a164}.d .choice:after{content:'◆';position:absolute;left:18px;color:#bf9c60;font:10px Georgia;letter-spacing:0}.d .choice i{position:absolute;right:18px;width:5px;height:5px;transform:rotate(45deg);border:1px solid #bf9c60}
main.single{grid-template-columns:1fr;max-width:1250px}.single .scene{height:680px}.single .menu{left:14%;top:80px;width:390px;max-width:45%}.single .logo{height:220px}.single .tagline{margin-bottom:30px}
@media(max-width:900px){main{grid-template-columns:1fr}.scene{height:460px}.menu{width:65%}.single .scene{height:550px}.single .menu{left:8%;top:35px;max-width:80%;width:390px}.single .logo{height:170px}}
@media(prefers-reduced-motion:reduce){.choice{transition:none}.choice:hover,.choice:active{transform:none}}
</style></head><body><header><h1>主界面按钮 · 四款对照</h1><p>同一背景、字号与按钮尺寸。可悬停查看反馈；此页仅作样式预览，不会开始游戏或改动存档。</p><label>查看方式 <select id="view"><option value="all">四款并排</option><option value="a">A · 厚铜古牌（最初版）</option><option value="b">B · 轻铜回纹</option><option value="c">C · 绢纸卷轴</option><option value="d">D · 朱漆金线</option></select></label></header><main></main>
<script>
const options=[['a','A · 厚铜古牌','最初版的完整铜饰、红绳和雕纹，厚实、有分量。'],['b','B · 轻铜回纹','小切角、细回纹与菱形端饰，保留古牌轮廓，降低厚重感。'],['c','C · 绢纸卷轴','暖色绢纸、墨色文字和纤细卷轴端头，更温润、书卷气。'],['d','D · 朱漆金线','深色漆面配朱红主按钮，双细金线与小菱纹，更沉稳。']];
document.querySelector('main').innerHTML=options.map(([id,title,desc])=>`<article class="${id}" data-option="${id}"><div class="caption"><h2>${title}</h2><p>${desc}</p></div><div class="scene"><section class="menu"><img class="logo" src="/main-menu-title-v02.png" alt="逆转五丈原"><p class="tagline">一灯未灭，天命未定。</p><nav aria-label="${title}按钮预览">${['新游戏','回溯舆图','存档留痕','设置'].map(label=>`<button class="choice" type="button">${id==='b'?'<i aria-hidden="true"></i>':''}${label}<i aria-hidden="true"></i></button>`).join('')}</nav></section></div></article>`).join('');
document.querySelector('#view').addEventListener('change',e=>{const v=e.target.value;document.querySelector('main').classList.toggle('single',v!=='all');document.querySelectorAll('article').forEach(a=>a.hidden=v!=='all'&&a.dataset.option!==v)});
</script></body></html>
