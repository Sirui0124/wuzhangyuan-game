<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>影像回看 · 逆转五丈原</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/film-history.css">
    <link rel="stylesheet" href="/subtitles.css">
</head>
<body>
    <main>
        <header>
            <a href="/">← 返回游戏</a>
            <h1>影像回看</h1>
        </header>
        <p id="empty" class="empty" hidden>暂无播放记录。游戏里播放过的影像会显示在这里。</p>
        <div class="archive" hidden>
            <section class="screen" aria-labelledby="film-title">
                <video controls playsinline preload="metadata" aria-labelledby="film-title"></video>
                <h2 id="film-title"></h2>
                <p id="film-status" role="status" hidden></p>
            </section>
            <ul class="films" aria-label="播放过的影像"></ul>
        </div>
    </main>
    <script type="module" src="/GameStarter/web-demo/src/film-history-page.js"></script>
</body>
</html>
